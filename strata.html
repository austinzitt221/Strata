const ENT_DEF = {
  grazer: { hp: 20, speed: 1.7, r: 0.42, h: 0.7, cap: 5 },
  lurker: { hp: 30, speed: 3.1, r: 0.42, h: 1.05, cap: 6 },
};
function entMesh(type){
  const g = new THREE.Group();
  const legs = [];
  const box = (w, h, d, color, x, y, z, parent) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshBasicMaterial({ color }));
    m.position.set(x, y, z);
    (parent || g).add(m);
    return m;
  };
  if (type === 'grazer'){
    box(0.72, 0.5, 1.0, 0xc8a24b, 0, 0.62, 0.05);            // body
    box(0.6, 0.12, 0.85, 0xb08d3f, 0, 0.9, 0.05);            // back fur ridge
    const head = box(0.4, 0.36, 0.34, 0xd8b45e, 0, 0.78, -0.62);
    box(0.22, 0.12, 0.1, 0x8a6f33, 0, -0.08, -0.2, head);    // snout
    box(0.08, 0.2, 0.06, 0xc8a24b, -0.16, 0.26, 0.02, head); // ears
    box(0.08, 0.2, 0.06, 0xc8a24b, 0.16, 0.26, 0.02, head);
    box(0.1, 0.1, 0.3, 0xb08d3f, 0, 0.7, 0.6);               // tail
    for (const [sx, sz] of [[-0.24,-0.32],[0.24,-0.32],[-0.24,0.36],[0.24,0.36]]){
      const leg = box(0.16, 0.42, 0.16, 0x8a6f33, sx, 0.21, sz);
      legs.push(leg);
    }
  } else {
    box(0.5, 0.7, 0.42, 0x1c1626, 0, 0.85, 0);               // hunched torso
    box(0.62, 0.16, 0.5, 0x120e1c, 0, 1.24, -0.02);          // shoulder ridge
    const head = box(0.36, 0.3, 0.34, 0x241b33, 0, 1.42, -0.12);
    const eyeM = new THREE.MeshBasicMaterial({ color: 0xff2b2b });
    for (const sx of [-0.1, 0.1]){
      const eye = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.05, 0.05), eyeM);
      eye.position.set(sx, 0.02, -0.18);
      head.add(eye);
    }
    for (const sx of [-0.2, 0.2]){                            // spikes
      box(0.08, 0.22, 0.08, 0x3a2c52, sx, 1.4, 0.12);
    }
    for (const sx of [-0.34, 0.34]){                          // long arms
      const arm = box(0.12, 0.7, 0.14, 0x181226, sx, 0.78, -0.04);
      box(0.14, 0.12, 0.16, 0x3a2c52, 0, -0.4, 0, arm);       // claw
      legs.push(arm);
    }
    for (const sx of [-0.15, 0.15]){
      const leg = box(0.15, 0.5, 0.16, 0x120e1c, sx, 0.25, 0.05);
      legs.push(leg);
    }
  }
  g.userData.legs = legs;
  g.userData.phase = Math.random() * 10;
  return g;
}
function reviveEntity(type, x, y, z, hp){
  return { type, x, y, z, vx: 0, vy: 0, vz: 0, hp,
           tt: 0, tx: x, tz: z, flash: 0, atkT: 0, fleeT: 0, mesh: null };
}
function spawnEntity(type, x, y, z){
  const e = reviveEntity(type, x, y, z, ENT_DEF[type].hp);
  game.entities.push(e);
  return e;
}
function killEntity(e, byPlayer){
  const i = game.entities.indexOf(e);
  if (i >= 0) game.entities.splice(i, 1);
  if (e.mesh){ game.scene.remove(e.mesh); e.mesh = null; }
  Particles.burst(e.x, e.y + 0.5, e.z, 0.5, [e.type === 'grazer' ? 0xc8a24b : 0x1c1626], 24, 2.2);
  AudioSys.sfx('die');
  if (byPlayer){
    if (e.type === 'grazer'){ CORE.addMat(game.slots, CORE.MAT.GLOWSHROOM, 8); toast('+8 glowshroom'); }
    else { CORE.addMat(game.slots, CORE.MAT.IRON, 4); toast('+4 iron (scavenged)'); }
    refreshHotbar(); refreshToolHUD();
  }
  markSave();
}
function hurtEntity(e, dmg, kx, kz){
  e.hp -= dmg;
  e.flash = 0.15;
  e.fleeT = 6;
  e.vx += kx; e.vz += kz; e.vy = Math.max(e.vy, 2.5);
  AudioSys.sfx('hit');
  if (e.hp <= 0) killEntity(e, true);
}
function nearestTorchDist(x, y, z){
  let best = 1e9;
  for (const t of game.torches){
    const d = Math.hypot(t[0]-x, t[1]-y, t[2]-z);
    if (d < best) best = d;
  }
  return best;
}
function trySpawnEntities(){
  if (game.mode !== 'survival') return;
  const counts = { grazer: 0, lurker: 0 };
  for (const e of game.entities) counts[e.type]++;
  const a = Math.random() * Math.PI * 2;
  const d = 22 + Math.random() * 20;
  const x = game.pos.x + Math.cos(a) * d, z = game.pos.z + Math.sin(a) * d;
  const h = game.gen.height(x, z);
  const night = game.dayF < 0.25;
  // lurkers spawn in the dark: night surface, or an underground air pocket
  if (counts.lurker < ENT_DEF.lurker.cap){
    if (night && nearestTorchDist(x, h, z) > 12){
      spawnEntity('lurker', x, h + 0.5, z); return;
    }
    const uy = h - 8 - Math.random() * 40;
    if (uy > CORE.BEDROCK_Y + 2 && CORE.evalSDF(x, uy, z, nearEdits([x-1,uy-1,z-1,x+1,uy+1,z+1]), game.gen) > 0.4 &&
        nearestTorchDist(x, uy, z) > 12){
      spawnEntity('lurker', x, uy, z); return;
    }
  }
  // grazers wander the surface by day
  if (counts.grazer < ENT_DEF.grazer.cap && game.dayF > 0.4){
    spawnEntity('grazer', x, h + 0.5, z);
  }
}
function updateEntities(dt, now){
  if (game.mode !== 'survival') return;
  game.spawnT += dt;
  if (game.spawnT > 3){ game.spawnT = 0; trySpawnEntities(); }
  for (let i = game.entities.length - 1; i >= 0; i--){
    const e = game.entities[i];
    const def = ENT_DEF[e.type];
    const pd = Math.hypot(e.x - game.pos.x, e.z - game.pos.z);
    if (pd > 70){                                  // too far — despawn
      if (e.mesh){ game.scene.remove(e.mesh); }
      game.entities.splice(i, 1);
      continue;
    }
    // steering
    e.tt -= dt; e.flash = Math.max(0, e.flash - dt); e.fleeT = Math.max(0, e.fleeT - dt); e.atkT = Math.max(0, e.atkT - dt);
    let sx = 0, sz = 0, sp = def.speed;
    if (e.type === 'lurker' && pd < 15){
      sx = game.pos.x - e.x; sz = game.pos.z - e.z;
      const d3 = Math.hypot(e.x - game.pos.x, e.y - game.pos.y, e.z - game.pos.z);
      if (d3 < 1.6 && e.atkT <= 0){
        e.atkT = 1;
        damagePlayer(8, (game.pos.x - e.x) * 2.5, (game.pos.z - e.z) * 2.5);
      }
    } else if (e.type === 'grazer' && e.fleeT > 0 && pd < 14){
      sx = e.x - game.pos.x; sz = e.z - game.pos.z; sp *= 1.8;
    } else {
      if (e.tt <= 0){ e.tt = 4 + Math.random() * 5; e.tx = e.x + (Math.random() - 0.5) * 14; e.tz = e.z + (Math.random() - 0.5) * 14; }
      sx = e.tx - e.x; sz = e.tz - e.z;
      if (Math.hypot(sx, sz) < 0.6){ sx = 0; sz = 0; }
    }
    const sl = Math.hypot(sx, sz) || 1;
    const wx = sx / sl * sp, wz = sz / sl * sp;
    e.vx += (wx - e.vx) * Math.min(1, 8 * dt);
    e.vz += (wz - e.vz) * Math.min(1, 8 * dt);
    e.vy -= 22 * dt;
    const ox = e.x;
    const oz = e.z;
    e.x += e.vx * dt; e.y += e.vy * dt; e.z += e.vz * dt;
    // sphere-vs-SDF collide
    const box = [e.x - 1.2, e.y - 1.2, e.z - 1.2, e.x + 1.2, e.y + def.h + 1.2, e.z + 1.2];
    const le = nearEdits(box);
    let grounded = false;
    for (let it = 0; it < 2; it++){
      const cy = e.y + def.r;
      const dd = sdfWorld(e.x, cy, e.z, le);
      if (dd < def.r){
        const g = gradWorld(e.x, cy, e.z, le);
        const push = Math.min(def.r - dd, 0.4);
        e.x += g[0] * push; e.y += g[1] * push; e.z += g[2] * push;
        if (g[1] > 0.5){ grounded = true; if (e.vy < 0) e.vy = 0; }
      }
    }
    // hop when stuck against a wall
    if (grounded && sl > 1 && Math.hypot(e.x - ox, e.z - oz) < sp * dt * 0.25) e.vy = 6.5;
    if (e.y < CORE.BEDROCK_Y + 0.3){ e.y = CORE.BEDROCK_Y + 0.3; e.vy = 0; }
    // mesh
    if (!e.mesh){ e.mesh = entMesh(e.type); game.scene.add(e.mesh); }
    e.mesh.position.set(e.x, e.y, e.z);
    const spd = Math.hypot(e.vx, e.vz);
    if (spd > 0.3) e.mesh.rotation.y = Math.atan2(-e.vx, -e.vz);
    // limb swing scales with travel speed
    const ud = e.mesh.userData;
    ud.phase += spd * dt * 3.2;
    const legs = ud.legs || [];
    for (let li = 0; li < legs.length; li++){
      legs[li].rotation.x = Math.sin(ud.phase + (li % 2) * Math.PI) * Math.min(0.7, spd * 0.3);
    }
    e.mesh.scale.setScalar(e.flash > 0 ? 1.1 : 1);
  }
}
// closest entity intersecting the view ray
function entityOnRay(maxDist){
  if (!game.entities.length) return null;
  const dir = new THREE.Vector3();
  game.camera.getWorldDirection(dir);
  const o = game.camera.position;
  let best = null, bestT = maxDist;
  for (const e of game.entities){
    const def = ENT_DEF[e.type];
    const vx = e.x - o.x, vy = e.y + def.h * 0.6 - o.y, vz = e.z - o.z;
    const t = vx * dir.x + vy * dir.y + vz * dir.z;
    if (t < 0 || t > bestT) continue;
    const px = vx - dir.x * t, py = vy - dir.y * t, pz = vz - dir.z * t;
    if (Math.hypot(px, py, pz) < def.r + 0.35){ best = e; bestT = t; }
  }
  return best;
}

// ---------- input ----------
const DIGITS = { Digit1:0, Digit2:1, Digit3:2, Digit4:3, Digit5:4, Digit6:5, Digit7:6, Digit8:7, Digit9:8, Digit0:9 };

function isLocked(){ return game.debugLock || document.pointerLockElement === game.renderer.domElement; }
function requestLock(){
  if (!isLocked()) game.renderer.domElement.requestPointerLock({ unadjustedMovement: true }).catch?.(()=>{});
}

function bindInput(){
  const cv = () => game.renderer.domElement;
  document.addEventListener('mousemove', e => {
    if (!game.running || !isLocked() || game.ui !== 'none') return;
    const s = game.opts.sens / 100 * 0.0022;
    game.yaw -= e.movementX * s;
    game.pitch -= e.movementY * s;
    game.pitch = Math.max(-Math.PI/2 + 0.001, Math.min(Math.PI/2 - 0.001, game.pitch));
  });
  document.addEventListener('mousedown', e => {
    if (!game.running || game.ui !== 'none') return;
    if (!isLocked()){ requestLock(); return; }
    if (e.button === 0){ game.mouseL = true; game.mouseEdge = true; }
    if (e.button === 1){ e.preventDefault(); pickMaterial(); }
    if (e.button === 2){
      const door = doorSys.onRay(3.5);
      if (door){
        door.open = !door.open;
        doorSys.rebuild();
        AudioSys.sfx('toggle');
        markSave();
        return;
      }
      if (activeTool()){
        game.tool.shape = (game.tool.shape + 1) % 3;
        toast(CORE.SHAPE_NAME[game.tool.shape]);
        AudioSys.sfx('toggle');
        refreshToolHUD(); markSave();
      }
    }
  });
  document.addEventListener('mouseup', e => { if (e.button === 0) game.mouseL = false; });
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('wheel', e => {
    if (!game.running || !isLocked() || game.ui !== 'none') return;
    const tool = activeTool();
    if (!tool) return;
    const dir = e.deltaY < 0 ? 1 : -1;
    if (game.keys['KeyG'] && game.tool.shape === 1 && !game.snapOn){
      // hold G + scroll: rotate the cube in 15° steps (free-place only)
      game.tool.rot = (game.tool.rot + dir * Math.PI / 12 + Math.PI * 2) % (Math.PI * 2);
      toast('rotate ' + Math.round(game.tool.rot * 180 / Math.PI) + '°');
    } else {
      game.tool.size = CORE.scrollSize(game.tool.size, tool.tier, dir);
    }
    refreshToolHUD(); markSave();
  }, { passive: true });

  document.addEventListener('keydown', e => {
    if (!game.running) return;
    const code = e.code;
    if (code === 'Escape') return; // browser handles pointer lock exit; see lockchange
    if (game.ui === 'inv' || game.ui === 'craft'){
      if (code === 'KeyE' && game.ui === 'inv') closeOverlay();
      else if (code === 'KeyQ' && game.ui === 'craft') closeOverlay();
      return;
    }
    if (game.ui !== 'none') return;
    game.keys[code] = true;
    if (code === 'KeyF'){ if (!game.fHeld){ game.fHeld = true; game.fUsedCombo = false; } e.preventDefault(); return; }
    if (code in DIGITS){
      if (game.fHeld){
        game.gridIdx = DIGITS[code]; game.fUsedCombo = true;
        toast('grid ' + CORE.GRID_SIZES[game.gridIdx] + 'm');
        refreshToolHUD();
      } else {
        game.hotSel = DIGITS[code]; refreshHotbar(); refreshToolHUD();
      }
      return;
    }
    if (code === 'KeyZ' && (e.ctrlKey || e.metaKey)){ e.preventDefault(); undoEdit(); return; }
    if (code === 'KeyZ'){
      if (game.mode === 'survival'){ toast('flying is creative-only'); }
      else { game.fly = !game.fly; game.vel.set(0,0,0); toast(game.fly ? 'fly on' : 'fly off'); AudioSys.sfx('toggle'); }
    }
    if (code === 'KeyH'){ tryEat(); }
    if (code === 'KeyR'){
      const tool = activeTool();
      if (tool && tool.kind === 'disp'){
        game.tool.mode = game.tool.mode === 'paint' ? 'build' : 'paint';
        toast(game.tool.mode === 'paint' ? 'paint mode — repaints existing ground' : 'build mode');
        AudioSys.sfx('toggle');
        refreshToolHUD(); markSave();
      }
    }
    if (code === 'KeyE'){ openInventory(); }
    if (code === 'KeyQ'){ openCraft(); }
  });
  document.addEventListener('keyup', e => {
    game.keys[e.code] = false;
    if (e.code === 'KeyF' && game.fHeld){
      game.fHeld = false;
      if (!game.fUsedCombo){
        game.snapOn = !game.snapOn;
        toast(game.snapOn ? 'grid snap on' : 'grid snap off');
        AudioSys.sfx('toggle');
        refreshToolHUD();
      }
    }
  });
  document.addEventListener('pointerlockchange', () => {
    if (!game.running) return;
    if (isLocked()){ AudioSys.resume(); return; }
    if (game.ui === 'none'){
      openPause(); // Esc (or lost lock) -> pause
    }
  });
}

// ---------- player physics ----------
function collidePlayer(edits, still){
  // capsule approximated by 3 spheres; iterative gradient pushout
  const r = PLAYER.radius;
  const h = playerHeight();
  const centers = [r + 0.02, h * 0.5, h - r - 0.02];
  game.grounded = false;
  for (let iter = 0; iter < 3; iter++){
    for (let ci = 0; ci < centers.length; ci++){
      const cy = game.pos.y + centers[ci];
      const d = sdfWorld(game.pos.x, cy, game.pos.z, edits);
      if (d < r){
        const g = gradWorld(game.pos.x, cy, game.pos.z, edits);
        const push = Math.min(r - d, 0.5);
        if (still && g[1] > 0.6){
          // standing on walkable ground with no input: resolve the
          // penetration straight up so the slope's normal can't drag the
          // player downhill frame by frame
          game.pos.y += push / g[1];
        } else {
          game.pos.x += g[0] * push;
          game.pos.y += g[1] * push;
          game.pos.z += g[2] * push;
        }
        const vn = game.vel.x*g[0] + game.vel.y*g[1] + game.vel.z*g[2];
        if (vn < 0){
          game.vel.x -= g[0]*vn; game.vel.y -= g[1]*vn; game.vel.z -= g[2]*vn;
        }
        if (g[1] > 0.55) game.grounded = true;
      }
    }
  }
  if (still && game.grounded){ game.vel.x = 0; game.vel.z = 0; }
  // extra ground probe (for jump when standing exactly on surface)
  if (!game.grounded && !game.fly){
    const d = sdfWorld(game.pos.x, game.pos.y + r, game.pos.z, edits);
    if (d < r + 0.06 && game.vel.y <= 0.01) game.grounded = true;
  }
}

function updatePlayer(dt){
  const k = game.keys;
  const canMove = game.ui === 'none' && isLocked();
  game.crouch = !!(canMove && k['KeyC'] && !game.fly);
  let fwd = 0, str = 0;
  if (canMove){
    if (k['KeyW']) fwd += 1;
    if (k['KeyS']) fwd -= 1;
    if (k['KeyD']) str += 1;
    if (k['KeyA']) str -= 1;
  }
  // camera-relative on the horizontal plane (yaw only — never world axes)
  const sin = Math.sin(game.yaw), cos = Math.cos(game.yaw);
  let mx = (-sin * fwd + cos * str);
  let mz = (-cos * fwd - sin * str);
  const ml = Math.hypot(mx, mz);
  if (ml > 1){ mx /= ml; mz /= ml; }

  const sprint = !!(canMove && (k['ShiftLeft'] || k['ShiftRight']));
  if (game.fly){
    let sp = PLAYER.flySpeed * (sprint ? PLAYER.flySprintMul : 1);
    game.vel.x = mx * sp; game.vel.z = mz * sp;
    let vy = 0;
    if (canMove && k['Space']) vy += sp;
    if (canMove && k['KeyC']) vy -= sp;
    game.vel.y = vy;
  } else {
    let sp = PLAYER.walk * (sprint ? PLAYER.sprintMul : 1) * (game.crouch ? PLAYER.crouchMul : 1);
    // snappy ground control, mild air control
    const a = game.grounded ? 22 : 6;
    game.vel.x += (mx * sp - game.vel.x) * Math.min(1, a * dt);
    game.vel.z += (mz * sp - game.vel.z) * Math.min(1, a * dt);
    game.vel.y -= PLAYER.gravity * dt;
    if (canMove && k['Space'] && game.grounded){ game.vel.y = PLAYER.jump; game.grounded = false; }
    if (game.vel.y < -40) game.vel.y = -40;
  }

  const preX = game.pos.x, preZ = game.pos.z;
  const intX = game.vel.x * dt, intZ = game.vel.z * dt;
  game.pos.x += game.vel.x * dt;
  game.pos.y += game.vel.y * dt;
  game.pos.z += game.vel.z * dt;

  const h = playerHeight();
  const box = [game.pos.x - 1.5, game.pos.y - 1.5, game.pos.z - 1.5,
               game.pos.x + 1.5, game.pos.y + h + 1.5, game.pos.z + 1.5];
  const still = !game.fly && fwd === 0 && str === 0 && !(canMove && k['Space']);
  const wasGrounded = game.grounded;
  const vyBefore = game.vel.y;
  const colEdits = nearEdits(box);
  collidePlayer(colEdits, still);

  // step-up assist: when horizontal motion is mostly eaten by a low ledge,
  // try the same spot a step higher instead of grinding against the lip.
  // Grounded or rising only — never while dropping into an opening, or the
  // assist would hoist the player back out of cave mouths.
  if (!game.fly && !still && (wasGrounded || game.vel.y > 0.5)){
    const intended = Math.hypot(intX, intZ);
    const actual = Math.hypot(game.pos.x - preX, game.pos.z - preZ);
    if (intended > 0.005 && actual < intended * 0.5){
      const nx = preX + intX + intX / intended * 0.1;
      const nz = preZ + intZ + intZ / intended * 0.1;
      // never step UP when there's a clear way DOWN ahead — stepping would
      // hoist the player out of cave mouths instead of letting them descend
      const canDescend = capsuleFree(nx, game.pos.y - 0.45, nz, colEdits);
      for (const step of canDescend ? [] : [0.3, 0.55]){
        if (capsuleFree(nx, game.pos.y + step, nz, colEdits)){
          game.pos.x = nx; game.pos.z = nz; game.pos.y += step;
          if (game.vel.y < 0) game.vel.y = 0;
          break;
        }
      }
    }
  }

  // fall damage: compare impact speed on the grounded transition
  if (!game.fly && game.grounded && !wasGrounded && game.mode === 'survival'){
    const impact = -vyBefore;
    if (impact > 11) damagePlayer(Math.round((impact - 11) * 5), 0, 0);
  }

  // never fall through bedrock even at low fps
  if (game.pos.y < CORE.BEDROCK_Y + 0.2){ game.pos.y = CORE.BEDROCK_Y + 0.2; if (game.vel.y < 0) game.vel.y = 0; }

  game.camera.position.set(game.pos.x, game.pos.y + h - PLAYER.eyeGap, game.pos.z);
  game.camera.rotation.set(game.pitch, game.yaw, 0);

  // footsteps
  const spd = Math.hypot(game.vel.x, game.vel.z);
  if (game.grounded && !game.fly && spd > 1.2){
    game.stepAcc = (game.stepAcc || 0) + spd * dt;
    if (game.stepAcc > 2.3){
      game.stepAcc = 0;
      const box = [game.pos.x - 1, game.pos.y - 1, game.pos.z - 1, game.pos.x + 1, game.pos.y + 1, game.pos.z + 1];
      AudioSys.sfx('step', CORE.materialAt(game.pos.x, game.pos.y - 0.15, game.pos.z, nearEdits(box), game.gen));
    }
  }
}

// ---------- tools / ghost / actions ----------
function selectedItem(){ return game.slots[game.hotSel] || null; }

// What the player is wielding right now. Holding a material stack while a
// dispenser sits in the dispenser slot auto-equips that dispenser loaded
// with the held material.
function activeTool(){
  const it = selectedItem();
  if (!it) return null;
  if (it.kind === 'drill') return { kind: 'drill', tier: it.tier };
  if (it.kind === 'sword') return { kind: 'sword', tier: it.tier };
  if (it.kind === 'gun') return { kind: 'gun', tier: 0 };
  if (it.kind === 'torch') return { kind: 'torch', tier: 0, item: it };
  if (it.kind === 'door') return { kind: 'door', tier: 0, item: it };
  if (it.kind === 'table') return { kind: 'table', tier: 0, item: it };
  if (it.kind === 'mat' && game.dispSlot)
    return { kind: 'disp', tier: game.dispSlot.tier, mat: it.mat, count: CORE.countMat(game.slots, it.mat) };
  return null;
}

// ghost position: fixed player-adjustable distance (V closer / B farther)
// normally; in grid mode, raymarch onto the surface and snap to the tiling
// lattice so placements connect flush
function ghostPlacement(eff){
  const dir = new THREE.Vector3();
  game.camera.getWorldDirection(dir);
  const o = game.camera.position;
  const reach = PLAYER.reach;
  if (!game.snapOn){
    const tt = Math.min(reach, Math.max(1.0, game.tool.dist));
    return { x: o.x + dir.x*tt, y: o.y + dir.y*tt, z: o.z + dir.z*tt };
  }
  const segBox = [
    Math.min(o.x, o.x + dir.x*reach) - 1, Math.min(o.y, o.y + dir.y*reach) - 1, Math.min(o.z, o.z + dir.z*reach) - 1,
    Math.max(o.x, o.x + dir.x*reach) + 1, Math.max(o.y, o.y + dir.y*reach) + 1, Math.max(o.z, o.z + dir.z*reach) + 1,
  ];
  const edits = nearEdits(segBox);
  let t = 0.4, hit = -1;
  for (let i = 0; i < 96 && t < reach; i++){
    const d = sdfWorld(o.x + dir.x*t, o.y + dir.y*t, o.z + dir.z*t, edits);
    if (d < 0.02){ hit = t; break; }
    t += Math.max(0.045, d * 0.5);
  }
  const tt = hit >= 0 ? hit : Math.min(reach * 0.7, 4 + eff * 0.6);
  const cell = CORE.GRID_SIZES[game.gridIdx];
  const [cx, cy, cz] = CORE.snapPlace(o.x + dir.x*tt, o.y + dir.y*tt, o.z + dir.z*tt, eff, cell);
  return { x: cx, y: cy, z: cz };
}

function updateGhost(){
  const tool = activeTool();
  const usable = tool && (tool.kind === 'drill' || tool.kind === 'disp') &&
                 game.ui === 'none' && isLocked();
  for (const k of [0, 1, 2]){
    game.ghostSet[k].fill.visible = false;
    game.ghostSet[k].wire.visible = false;
  }
  if (game.gridViz) game.gridViz.visible = false;
  if (!usable){ game.ghostPos = null; return; }

  const eff = CORE.effSize(game.tool.size, tool.tier);
  game.ghostEff = eff;
  const p = ghostPlacement(eff);
  game.ghostPos = p;
  const gs = game.ghostSet[game.tool.shape];
  const paint = tool.kind === 'disp' && game.tool.mode === 'paint';
  gs.fill.material.color.set(paint ? 0xffb44d : tool.kind === 'disp' ? 0x8bff9e : 0x6fd3ff);
  gs.fill.visible = true; gs.wire.visible = true;
  gs.fill.position.set(p.x, p.y, p.z); gs.wire.position.set(p.x, p.y, p.z);
  gs.fill.scale.setScalar(eff); gs.wire.scale.setScalar(eff);
  const rot = editRot(game.tool.shape);
  gs.fill.rotation.y = rot; gs.wire.rotation.y = rot;
  // charging feedback: the shape visibly "fills in" as the action completes
  gs.fill.material.opacity = 0.22 + game.actProgress * 0.3;

  if (game.snapOn){
    // visualize the actual placement lattice (spacing = shape size when the
    // grid cell is smaller), anchored on the ghost's bottom face
    const s = CORE.snapSpacing(eff, CORE.GRID_SIZES[game.gridIdx]);
    if (!game.gridViz || game.gridVizCell !== s) buildGridViz(s);
    game.gridViz.visible = true;
    const h = eff * 0.5;
    game.gridViz.position.set(p.x - h, p.y - h, p.z - h);
  }
}

function applyEdit(e){
  game.edits.push(e);
  game.terrain.invalidate(e);
  markSave();
}

function editRot(shape){
  return (shape === 1 && !game.snapOn) ? game.tool.rot : 0;
}
function yieldColors(got){
  const cols = [];
  for (const m in got) cols.push(MAT_COLOR[m]);
  return cols;
}
function doMine(tool, p, shape, eff){
  const e = CORE.makeEdit(0, shape, p.x, p.y, p.z, eff, 0, editRot(shape));
  const got = CORE.mineYield(game.edits, e, game.gen);
  let units = 0, hw = 0;
  for (const m in got){ units += got[m]; hw += got[m] * (CORE.HARDNESS[m] || 1); }
  if (units === 0) return;                        // nothing but air — no edit
  applyEdit(e);
  game.undoStack.push({ edit: e, type: 'mine', gained: got });
  if (game.undoStack.length > 64) game.undoStack.shift();
  const parts = [];
  for (const m in got){
    if (CORE.addMat(game.slots, +m, got[m])) parts.push('+' + got[m] + ' ' + CORE.MAT_NAME[m]);
    else parts.push('inventory full — lost ' + got[m] + ' ' + CORE.MAT_NAME[m]);
  }
  const poppedTorches = torchSys.removeNear(p.x, p.y, p.z, eff * 0.5 + 0.6);
  if (poppedTorches){ addTorchesToInv(poppedTorches); parts.push('+' + poppedTorches + ' torch'); }
  const poppedDoors = doorSys.removeNear(p.x, p.y, p.z, eff * 0.5 + 0.8);
  if (poppedDoors){ addStackItem('door', poppedDoors); parts.push('+' + poppedDoors + ' door'); }
  const poppedTables = tableSys.removeNear(p.x, p.y, p.z, eff * 0.5 + 0.8);
  if (poppedTables){ addStackItem('table', poppedTables); parts.push('+' + poppedTables + ' table'); }
  // trees whose ground was carved away fall and yield their wood
  for (const [k, v] of [...treeSys.visible]){
    const t = v.t;
    if (Math.hypot(t.x - p.x, t.y - p.y, t.z - p.z) < eff * 0.5 + 3 &&
        CORE.evalSDF(t.x, t.y + 0.2, t.z, game.edits, game.gen) > 0.25){
      treeSys.fell(k, true);
    }
  }
  if (parts.length) toast(parts.join('  ·  '));
  AudioSys.sfx('break', hw / units);
  Particles.burst(p.x, p.y, p.z, eff * 0.5, yieldColors(got), Math.min(70, 14 + units / 4), 2.6);
  refreshHotbar(); refreshToolHUD();
}
function doPlace(tool, p, shape, eff){
  const paint = game.tool.mode === 'paint';
  const e = CORE.makeEdit(paint ? 2 : 1, shape, p.x, p.y, p.z, eff, tool.mat, editRot(shape));
  const cost = paint ? CORE.paintCost(game.edits, e, game.gen)
                     : CORE.placeCost(game.edits, e, game.gen);
  if (cost === 0) return;
  if (game.mode !== 'creative' && !CORE.consumeMat(game.slots, tool.mat, cost)){
    toast('need ' + cost + ' ' + CORE.MAT_NAME[tool.mat] + ' — have ' + CORE.countMat(game.slots, tool.mat));
    game.orbFlash = performance.now();
    AudioSys.sfx('deny');
    return;
  }
  applyEdit(e);
  game.undoStack.push({ edit: e, type: paint ? 'paint' : 'place', mat: tool.mat,
                        cost: game.mode === 'creative' ? 0 : cost });
  if (game.undoStack.length > 64) game.undoStack.shift();
  toast('-' + cost + ' ' + CORE.MAT_NAME[tool.mat] + (paint ? ' (painted)' : ''));
  AudioSys.sfx(paint ? 'paint' : 'place');
  Particles.burst(p.x, p.y, p.z, eff * 0.5, [MAT_COLOR[tool.mat]], Math.min(40, 8 + cost / 6), 1.6);
  refreshHotbar(); refreshToolHUD();
}
function undoEdit(){
  if (!game.edits.length){ toast('nothing to undo'); return; }
  const e = game.edits.pop();
  game.terrain.invalidate(e);
  const rec = game.undoStack.length && game.undoStack[game.undoStack.length - 1].edit === e
    ? game.undoStack.pop() : null;
  if (rec){
    if (rec.type === 'mine'){
      for (const m in rec.gained){
        const have = CORE.countMat(game.slots, +m);
        CORE.consumeMat(game.slots, +m, Math.min(have, rec.gained[m]));
      }
    } else {
      CORE.addMat(game.slots, rec.mat, rec.cost);
    }
  }
  toast('undo');
  AudioSys.sfx('undo');
  refreshHotbar(); refreshToolHUD(); markSave();
}

// Hold LMB to break one shape over the tier's mine time (drill keeps cycling
// while held). Dispenser builds one shape per click — hold to charge, release
// cancels, and it never auto-repeats. Diamond tier is instant.
// duration of the pending action, cached per ghost target (recomputed when
// the target moves — mine time scales with solid volume and hardness, build
// time with the volume actually being filled)
function actionPlan(tool, p, shape, eff){
  const key = tool.kind + tool.tier + '|' + (tool.mat || 0) + '|' + game.tool.mode + '|' + shape + '|' + eff.toFixed(2) + '|' +
    Math.round(p.x * 2) + ',' + Math.round(p.y * 2) + ',' + Math.round(p.z * 2);
  if (game.act.key === key) return game.act.plan;
  const rot = editRot(shape);
  let plan;
  if (tool.kind === 'drill'){
    const e = CORE.makeEdit(0, shape, p.x, p.y, p.z, eff, 0, rot);
    const dur = CORE.mineDuration(tool.tier, CORE.mineYield(game.edits, e, game.gen));
    plan = { dur: (game.mode === 'creative' && dur > 0) ? 0 : dur };
  } else {
    const paint = game.tool.mode === 'paint';
    const e = CORE.makeEdit(paint ? 2 : 1, shape, p.x, p.y, p.z, eff, tool.mat, rot);
    const cost = paint ? CORE.paintCost(game.edits, e, game.gen)
                       : CORE.placeCost(game.edits, e, game.gen);
    plan = { dur: cost === 0 ? -1 : game.mode === 'creative' ? 0 : CORE.placeDuration(tool.tier, cost) };
  }
  game.act.key = key; game.act.plan = plan;
  return plan;
}

function tryAction(dt, now){
  const tool = activeTool();
  const edge = game.mouseEdge; game.mouseEdge = false;
  game.actProgress = 0;
  if (!tool || game.ui !== 'none' || !isLocked()){
    game.act.t = 0; game.act.charging = false; AudioSys.setHum(false, 0, 0); return;
  }

  // sword: THE melee weapon
  if (tool.kind === 'sword'){
    AudioSys.setHum(false, 0, 0);
    if (game.mouseL && (edge || now - game.lastMelee > 380)){
      game.lastMelee = now;
      game.swingT = now;
      AudioSys.burst({ dur: 0.08, freq: 1400, gain: 0.08 });
      const ent = entityOnRay(3.6);
      if (ent) hurtEntity(ent, 10 + tool.tier * 4, (ent.x - game.pos.x) * 2, (ent.z - game.pos.z) * 2);
    }
    return;
  }
  // placeables
  if (tool.kind === 'door' || tool.kind === 'table'){
    AudioSys.setHum(false, 0, 0);
    if (edge){
      const hit = surfaceHit();
      if (!hit){ toast('no ground in reach'); return; }
      tool.item.count--;
      if (tool.item.count <= 0) game.slots[game.hotSel] = null;
      if (tool.kind === 'door') doorSys.place(hit[0], hit[1], hit[2]);
      else tableSys.add(hit[0], hit[1], hit[2]);
      AudioSys.sfx('place');
      refreshHotbar(); refreshToolHUD();
    }
    return;
  }
  // blaster: hitscan, hold-fire at 2/s
  if (tool.kind === 'gun'){
    AudioSys.setHum(false, 0, 0);
    if (game.mouseL && now - game.lastShot > 500){
      game.lastShot = now;
      AudioSys.sfx('shot');
      game.pitch = Math.min(Math.PI / 2 - 0.01, game.pitch + 0.025);
      const ent = entityOnRay(45);
      if (ent){
        hurtEntity(ent, 18, (ent.x - game.pos.x) * 0.8, (ent.z - game.pos.z) * 0.8);
        Particles.burst(ent.x, ent.y + 0.6, ent.z, 0.3, [0xff5544], 10, 2);
      }
    }
    return;
  }
  // torch: place one on the surface you're looking at
  if (tool.kind === 'torch'){
    AudioSys.setHum(false, 0, 0);
    if (edge){
      const hit = surfaceHit();
      if (!hit){ toast('no surface in reach'); return; }
      tool.item.count--;
      if (tool.item.count <= 0) game.slots[game.hotSel] = null;
      torchSys.add(hit[0], hit[1], hit[2]);
      AudioSys.sfx('place');
      refreshHotbar(); refreshToolHUD();
    }
    return;
  }

  // drill chops trees (fighting needs a sword or the blaster)
  if (tool.kind === 'drill' && game.mouseL){
    const treeKey = treeSys.onRay(PLAYER.reach * 0.8);
    if (treeKey){
      const chopDur = game.mode === 'creative' ? 0.15 : 1.4 / (1 + tool.tier * 0.35);
      game.act.t += dt;
      game.actProgress = Math.min(1, game.act.t / chopDur);
      AudioSys.setHum(true, tool.tier, game.actProgress);
      if (game.act.t >= chopDur){
        game.act.t = 0;
        treeSys.fell(treeKey, true);
      }
      return;
    }
  }

  const usable = game.ghostPos;
  if (!usable){ game.act.t = 0; game.act.charging = false; AudioSys.setHum(false, 0, 0); return; }
  const p = game.ghostPos, shape = game.tool.shape, eff = game.ghostEff;

  if (tool.kind === 'drill'){
    if (!game.mouseL){ game.act.t = 0; AudioSys.setHum(false, 0, 0); return; }
    const plan = actionPlan(tool, p, shape, eff);
    if (plan.dur < 0){ AudioSys.setHum(false, 0, 0); return; }   // nothing to mine here
    if (plan.dur === 0){
      if (edge || now - game.lastAction > 250){ game.lastAction = now; doMine(tool, p, shape, eff); }
      return;
    }
    game.act.t += dt;
    game.actProgress = Math.min(1, game.act.t / plan.dur);
    AudioSys.setHum(true, tool.tier, game.actProgress);
    if (Math.random() < dt * 22)
      Particles.burst(p.x, p.y, p.z, eff * 0.4, [0x9a9aa0], 2, 1.2);
    if (game.act.t >= plan.dur){ game.act.t = 0; game.act.key = null; doMine(tool, p, shape, eff); }
    return;
  }

  // dispenser: one placement per click, consumes the held material by volume
  AudioSys.setHum(false, 0, 0);
  const plan = actionPlan(tool, p, shape, eff);
  if (plan.dur < 0) return;                                       // nothing to fill/paint
  if (plan.dur === 0){
    if (edge) doPlace(tool, p, shape, eff);
    return;
  }
  if (edge){ game.act.charging = true; game.act.t = 0; }
  if (!game.mouseL){ game.act.charging = false; game.act.t = 0; return; }
  if (game.act.charging){
    game.act.t += dt;
    game.actProgress = Math.min(1, game.act.t / plan.dur);
    if (game.act.t >= plan.dur){
      game.act.charging = false; game.act.t = 0; game.act.key = null;
      doPlace(tool, p, shape, eff);
    }
  }
}

// raymarch the view ray to the first surface within reach
function surfaceHit(){
  const dir = new THREE.Vector3();
  game.camera.getWorldDirection(dir);
  const o = game.camera.position;
  const segBox = [o.x - 10, o.y - 10, o.z - 10, o.x + 10, o.y + 10, o.z + 10];
  const edits = nearEdits(segBox);
  let t = 0.4;
  for (let i = 0; i < 96 && t < PLAYER.reach; i++){
    const x = o.x + dir.x * t, y = o.y + dir.y * t, z = o.z + dir.z * t;
    const d = sdfWorld(x, y, z, edits);
    if (d < 0.02) return [x, y, z];
    t += Math.max(0.045, d * 0.5);
  }
  return null;
}

// middle click: pick the material you're looking at into your hand
function pickMaterial(){
  if (!game.running || !isLocked() || game.ui !== 'none') return;
  const dir = new THREE.Vector3();
  game.camera.getWorldDirection(dir);
  const o = game.camera.position;
  const segBox = [o.x - 10, o.y - 10, o.z - 10, o.x + 10, o.y + 10, o.z + 10];
  const edits = nearEdits(segBox);
  let t = 0.4, hit = null;
  for (let i = 0; i < 96 && t < PLAYER.reach; i++){
    const x = o.x + dir.x * t, y = o.y + dir.y * t, z = o.z + dir.z * t;
    const d = sdfWorld(x, y, z, edits);
    if (d < 0.02){ hit = [x, y, z]; break; }
    t += Math.max(0.045, d * 0.5);
  }
  if (!hit){ toast('nothing in reach'); return; }
  const m = CORE.materialAt(hit[0], hit[1] - 0.05, hit[2], edits, game.gen);
  if (m === CORE.MAT.BEDROCK){ toast('bedrock is not collectable'); return; }
  let idx = -1;
  for (let i = 0; i < 40; i++){
    const s = game.slots[i];
    if (s && s.kind === 'mat' && s.mat === m){ idx = i; break; }
  }
  if (idx < 0){ toast('no ' + CORE.MAT_NAME[m] + ' in inventory'); return; }
  if (idx < 10){ game.hotSel = idx; }
  else {
    const tmp = game.slots[game.hotSel];
    game.slots[game.hotSel] = game.slots[idx];
    game.slots[idx] = tmp;
  }
  toast(CORE.MAT_NAME[m]);
  AudioSys.sfx('select');
  refreshHotbar(); refreshToolHUD();
}

// V/B: pull the ghost closer / push it farther (free-place mode only)
function updateGhostDist(dt){
  if (game.ui !== 'none' || !isLocked() || game.snapOn) return;
  const k = game.keys;
  let d = 0;
  if (k['KeyV']) d -= 1;
  if (k['KeyB']) d += 1;
  if (d){
    game.tool.dist = Math.min(PLAYER.reach, Math.max(1.0, game.tool.dist + d * 6 * dt));
    refreshToolHUD(); markSave();
  }
}

// ---------- item icons ----------
const TIER_COL = ['#8a8a92', '#c9c7d1', '#d84a63', '#5d4a86', '#6fe3ef'];
const iconCache = new Map();
function itemIconURL(it){
  if (!it) return null;
  const key = it.kind === 'mat' ? 'm' + it.mat
    : ['gun', 'torch', 'door', 'table'].includes(it.kind) ? it.kind : it.kind + it.tier;
  if (iconCache.has(key)) return iconCache.get(key);
  const cv = document.createElement('canvas');
  cv.width = 16; cv.height = 16;
  const c = cv.getContext('2d');
  if (it.kind === 'mat'){
    c.drawImage(tileCanvas(it.mat, game.seed || 1), 0, 0);
  } else if (it.kind === 'gun'){
    c.fillStyle = '#5a4632'; c.fillRect(4, 9, 3, 5);
    c.fillStyle = '#2f2d38'; c.fillRect(3, 6, 9, 4);
    c.fillStyle = '#3c3a44'; c.fillRect(12, 7, 3, 2);
    c.fillStyle = '#d84a63'; c.fillRect(6, 5, 3, 1); c.fillRect(13, 7, 1, 1);
  } else if (it.kind === 'torch'){
    c.fillStyle = '#5a4632'; c.fillRect(7, 5, 2, 9);
    c.fillStyle = '#ffb347'; c.fillRect(6, 2, 4, 4);
    c.fillStyle = '#ffe08a'; c.fillRect(7, 3, 2, 2);
  } else if (it.kind === 'door'){
    c.fillStyle = '#8a6237'; c.fillRect(4, 2, 8, 12);
    c.fillStyle = '#6b4a26'; c.fillRect(4, 2, 8, 1); c.fillRect(4, 7, 8, 1);
    c.fillStyle = '#d8c485'; c.fillRect(10, 8, 1, 2);
  } else if (it.kind === 'table'){
    c.fillStyle = '#9c7344'; c.fillRect(2, 5, 12, 2);
    c.fillStyle = '#6b4a26'; c.fillRect(3, 7, 2, 7); c.fillRect(11, 7, 2, 7);
    c.fillStyle = '#59c8d8'; c.fillRect(8, 3, 3, 2);
  } else if (it.kind === 'sword'){
    const col = TIER_COL[it.tier];
    c.fillStyle = '#5a4632'; c.fillRect(3, 11, 3, 3);
    c.fillStyle = '#3c3a44'; c.fillRect(2, 10, 6, 2);
    c.fillStyle = col;
    for (let i = 0; i < 7; i++) c.fillRect(6 + i, 9 - i, 2, 2);
  } else {
    const col = TIER_COL[it.tier];
    if (it.kind === 'drill'){
      // handle
      c.fillStyle = '#5a4632'; c.fillRect(2, 10, 4, 4);
      c.fillStyle = '#7a6244'; c.fillRect(3, 9, 3, 2);
      // body
      c.fillStyle = '#3c3a44'; c.fillRect(4, 6, 5, 5);
      // bit (tier colored, pointed)
      c.fillStyle = col;
      c.fillRect(8, 7, 3, 3); c.fillRect(11, 8, 2, 2); c.fillRect(13, 8, 1, 1);
      c.fillStyle = '#ffffff33'; c.fillRect(8, 7, 5, 1);
    } else {
      // dispenser: gravity-gun-ish, barrel sphere shows loaded material
      c.fillStyle = '#5a4632'; c.fillRect(2, 10, 3, 4);
      c.fillStyle = '#3c3a44'; c.fillRect(3, 6, 6, 5);
      c.fillStyle = col; c.fillRect(3, 5, 6, 1); c.fillRect(9, 7, 2, 3);
      c.fillStyle = '#222028'; c.fillRect(11, 7, 3, 3);
      c.fillStyle = col; c.fillRect(11, 7, 1, 1);
    }
  }
  const url = cv.toDataURL();
  iconCache.set(key, url);
  return url;
}
function itemLabel(it){
  if (!it) return '';
  if (it.kind === 'mat') return CORE.MAT_NAME[it.mat];
  if (it.kind === 'gun') return 'blaster';
  if (it.kind === 'torch') return 'torches';
  if (it.kind === 'door') return 'door';
  if (it.kind === 'table') return 'crafting table';
  const t = CORE.TIER_NAME[it.tier];
  if (it.kind === 'sword') return t + ' sword';
  if (it.kind === 'drill') return t + ' drill';
  return t + ' dispenser';
}
function fmtCount(n){ return n >= 10000 ? Math.floor(n/1000) + 'k' : String(n); }

// ---------- hotbar / inventory UI ----------
function slotEl(i, keyLabel){
  const d = document.createElement('div');
  d.className = 'slot'; d.dataset.slot = i;
  if (keyLabel){ const k = document.createElement('span'); k.className = 'key'; k.textContent = keyLabel; d.appendChild(k); }
  const img = document.createElement('img'); img.alt = ''; d.appendChild(img);
  const cnt = document.createElement('span'); cnt.className = 'cnt'; d.appendChild(cnt);
  return d;
}
function slotItem(key){ return key === 'disp' ? game.dispSlot : game.slots[+key]; }
function paintSlot(el){
  const key = el.dataset.slot;
  const it = slotItem(key);
  const i = key === 'disp' ? -1 : +key;
  const img = el.querySelector('img'), cnt = el.querySelector('.cnt');
  const url = itemIconURL(it);
  if (url){ img.src = url; img.style.display = 'block'; } else { img.style.display = 'none'; }
  cnt.textContent = (it && it.count != null) ? fmtCount(it.count) : '';
  el.title = itemLabel(it);
  el.classList.toggle('sel', i === game.hotSel && el.parentElement.id === 'hotbar');
}
function buildHotbar(){
  const hb = $('hotbar'); hb.innerHTML = '';
  for (let i = 0; i < 10; i++) hb.appendChild(slotEl(i, String((i + 1) % 10)));
  refreshHotbar();
}
function refreshHotbar(){
  document.querySelectorAll('#hotbar .slot').forEach(paintSlot);
}
function buildInvUI(){
  const main = $('invmain'), hot = $('invhot'), dsp = $('invdisp');
  main.innerHTML = ''; hot.innerHTML = ''; dsp.innerHTML = '';
  dsp.appendChild(slotEl('disp'));
  for (let i = 10; i < 40; i++) main.appendChild(slotEl(i));
  for (let i = 0; i < 10; i++) hot.appendChild(slotEl(i, String((i + 1) % 10)));
  refreshInvUI();
}
function refreshInvUI(){
  document.querySelectorAll('#invmain .slot, #invhot .slot, #invdisp .slot').forEach(paintSlot);
}

// slot move including the dispenser pseudo-slot ('disp'), which only ever
// accepts a dispenser
function uiMove(from, to){
  if (from === to) return 'none';
  if (typeof from === 'number' && typeof to === 'number')
    return CORE.invMove(game.slots, from, to);
  const get = k => k === 'disp' ? game.dispSlot : game.slots[k];
  const set = (k, v) => { if (k === 'disp') game.dispSlot = v; else game.slots[k] = v; };
  const A = get(from), B = get(to);
  if (!A) return 'none';
  if (to === 'disp' && A.kind !== 'disp'){ toast('only a dispenser fits in the dispenser slot'); return 'none'; }
  if (from === 'disp' && B && B.kind !== 'disp'){ toast('that slot is taken'); return 'none'; }
  set(from, B || null); set(to, A);
  return 'swapped';
}

// drag & drop
const drag = { active: false, from: -1 };
function bindInvDnD(){
  const dgy = $('draggy'), dgi = dgy.querySelector('img');
  document.addEventListener('mousedown', e => {
    if (game.ui !== 'inv') return;
    const el = e.target.closest('.slot');
    if (!el || el.parentElement.id === 'hotbar') return;
    const key = el.dataset.slot === 'disp' ? 'disp' : +el.dataset.slot;
    if (!slotItem(key)) return;
    drag.active = true; drag.from = key;
    dgi.src = itemIconURL(slotItem(key));
    dgy.style.display = 'block';
    dgy.style.left = (e.clientX - 26) + 'px'; dgy.style.top = (e.clientY - 26) + 'px';
    e.preventDefault();
  });
  document.addEventListener('mousemove', e => {
    if (!drag.active) return;
    dgy.style.left = (e.clientX - 26) + 'px'; dgy.style.top = (e.clientY - 26) + 'px';
    document.querySelectorAll('.drop-ok').forEach(x => x.classList.remove('drop-ok'));
    const el = e.target.closest && e.target.closest('.slot');
    if (el && el.parentElement.id !== 'hotbar') el.classList.add('drop-ok');
  });
  document.addEventListener('mouseup', e => {
    if (!drag.active) return;
    drag.active = false; dgy.style.display = 'none';
    document.querySelectorAll('.drop-ok').forEach(x => x.classList.remove('drop-ok'));
    const el = e.target.closest && e.target.closest('.slot');

      const to = el.dataset.slot === 'disp' ? 'disp' : +el.dataset.slot;
      uiMove(drag.from, to);

// ---------- survival: damage, death, hunger ----------
function damagePlayer(dmg, kx, kz){
  if (game.mode !== 'survival' || game.ui !== 'none') return;
  game.hp = Math.max(0, game.hp - dmg);
  game.hurtT = performance.now();
  $('hurt').style.opacity = 1;
  setTimeout(() => { $('hurt').style.opacity = 0; }, 180);
  if (kx || kz){ game.vel.x += kx; game.vel.z += kz; game.vel.y += 2.5; }
  AudioSys.sfx('hurt');
  if (game.hp <= 0) die();
}
function die(){
  // everything drops where you fell; you keep a mercy stone drill
  game.deathCache = {
    x: game.pos.x, y: game.pos.y + 0.6, z: game.pos.z,
    slots: game.slots, dispSlot: game.dispSlot,
  };
  game.slots = new Array(40).fill(null);
  game.slots[0] = CORE.makeDrill(0);
  game.dispSlot = null;
  game.hotSel = 0;
  game.ui = 'dead';
  $('deathinfo').textContent = 'your gear dropped at ' +
    Math.round(game.deathCache.x) + ' ' + Math.round(game.deathCache.y) + ' ' + Math.round(game.deathCache.z);
  show('deathscreen');
  document.exitPointerLock();
  updateCacheMarker();
  saveNow();
}
function respawn(){
  const h = game.gen.height(0, 0);
  game.pos.set(0, h + 1.5, 0);
  game.vel.set(0, 0, 0);
  game.hp = 100; game.food = 100;
  hide('deathscreen');
  game.ui = 'none';
  requestLock();
  refreshHotbar(); refreshToolHUD();
  markSave();
}
function updateCacheMarker(){
  if (game.cacheMarker){ game.scene.remove(game.cacheMarker); game.cacheMarker = null; }
  if (!game.deathCache) return;
  const m = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5),
    new THREE.MeshBasicMaterial({ color: 0xffd23b, transparent: true, opacity: 0.9 }));
  m.position.set(game.deathCache.x, game.deathCache.y, game.deathCache.z);
  game.scene.add(m);
  game.cacheMarker = m;
}
function tryPickupCache(){
  const c = game.deathCache;
  if (!c) return;
  if (Math.hypot(c.x - game.pos.x, c.y - game.pos.y, c.z - game.pos.z) > 2.5) return;
  const items = c.slots.filter(Boolean);
  if (c.dispSlot){
    if (!game.dispSlot) game.dispSlot = c.dispSlot;
    else items.push(c.dispSlot);
  }
  let left = 0;
  for (const it of items){
    if (it.kind === 'mat'){ CORE.addMat(game.slots, it.mat, it.count); continue; }
    if (['torch', 'door', 'table'].includes(it.kind)){ addStackItem(it.kind, it.count); continue; }
    let placed = false;
    for (let i = 0; i < 40; i++) if (!game.slots[i]){ game.slots[i] = it; placed = true; break; }
    if (!placed) left++;
  }
  game.deathCache = null;
  updateCacheMarker();
  toast(left ? 'gear recovered (inventory full — ' + left + ' items lost)' : 'gear recovered');
  AudioSys.sfx('craft');
  refreshHotbar(); refreshToolHUD();
  markSave();
}
function updateSurvival(dt){
  if (game.mode !== 'survival'){ return; }
  if (game.ui !== 'none') return;
  const sprint = (game.keys['ShiftLeft'] || game.keys['ShiftRight']) && Math.hypot(game.vel.x, game.vel.z) > 4;
  game.food = Math.max(0, game.food - dt * (sprint ? 0.45 : 0.2));
  if (game.food <= 0) damagePlayer(dt * 2.2, 0, 0);
  else if (game.food > 60 && game.hp < 100 && game.hp > 0){
    game.hp = Math.min(100, game.hp + dt * 1.6);
    game.food = Math.max(0, game.food - dt * 0.1);
  }
  tryPickupCache();
}
function tryEat(){
  if (game.mode !== 'survival'){ toast('no hunger in creative'); return; }
  const it = selectedItem();
  if (!it || it.kind !== 'mat' || it.mat !== CORE.MAT.GLOWSHROOM){ toast('hold glowshroom to eat (H)'); return; }
  if (game.food > 95){ toast('not hungry'); return; }
  if (it.count < 8){ toast('need 8 glowshroom to eat'); return; }
  it.count -= 8;
  if (it.count === 0) game.slots[game.hotSel] = null;
  game.food = Math.min(100, game.food + 30);
  toast('ate glowshroom (+30 food)');
  AudioSys.sfx('eat');
  refreshHotbar(); refreshToolHUD();
}

let pendingDelete = null;
function refreshWorldList(){
  const list = $('worldlist'); list.innerHTML = '';

  if (ix.length === 0){

    d.className = 'sub'; d.textContent = 'no worlds yet — create one below';

function escapeHtml(s){ return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
let newWorldMode = 'survival';
function createWorld(){
  const name = $('newWorldName').value.trim() || 'world ' + (worldIndex().length + 1);
  let seedStr = $('newWorldSeed').value.trim();
  if (!seedStr) seedStr = String(Math.floor(Math.random() * 1e9));
  const id = Date.now().toString(36) + Math.floor(Math.random() * 1e6).toString(36);
  const ix = worldIndex();
  ix.push({ id, name, seed: seedStr, mode: newWorldMode, created: Date.now() });
  saveWorldIndex(ix);
  saveWorldData(id, freshWorldData(name, seedStr, newWorldMode));
  $('newWorldName').value = ''; $('newWorldSeed').value = '';
  refreshWorldList();
}
function freshWorldData(name, seedStr, mode){
  return {
    v: 4, name, seed: seedStr, mode: mode || 'survival',
    edits: [],
    player: { x: 0, y: null, z: 0, yaw: 0, pitch: 0, fly: false },
    slots: null, hotSel: 0, snapOn: false, gridIdx: 3,
  };
}
function defaultSlots(mode){
  const s = new Array(40).fill(null);
  if (mode === 'creative'){
    for (let t = 0; t < 5; t++) s[t] = CORE.makeDrill(t);
    s[5] = CORE.makeGun();
    s[6] = CORE.makeTorches(64);
    s[7] = CORE.makeSword(4);
    s[8] = CORE.makeDoors(10);
    s[9] = CORE.makeTables(4);
    for (let m = 1; m <= CORE.NMAT; m++){
      if (m === CORE.MAT.BEDROCK) continue;
      CORE.addMat(s, m, 99999);
    }
    for (let t = 0; t < 4; t++){
      for (let i = 10; i < 40; i++) if (!s[i]){ s[i] = CORE.makeDispenser(t); break; }
    }
  } else {
    s[0] = CORE.makeDrill(0);   // survival: earn the rest
  }
  return s;
}

// ---------- save / load ----------
function markSave(){ game.savePending = true; game.saveTimer = performance.now(); }
function saveNow(){
  if (!game.running || !game.worldId) return;
  const data = {
    v: 4, name: game.worldName, seed: game.seedStr, mode: game.mode,
    edits: CORE.serializeEdits(game.edits),
    player: { x: game.pos.x, y: game.pos.y, z: game.pos.z, yaw: game.yaw, pitch: game.pitch, fly: game.fly },
    slots: game.slots, dispSlot: game.dispSlot, tool: game.tool,
    hotSel: game.hotSel, snapOn: game.snapOn, gridIdx: game.gridIdx,
    hp: game.hp, food: game.food, timeOfDay: game.timeOfDay,
    torches: game.torches,
    doors: game.doors.map(d => [d.x, d.y, d.z, d.yaw, d.open ? 1 : 0]),
    tables: game.tables,
    removedTrees: [...(game.removedTreeSet || [])],
    entities: game.entities.map(e => [e.type, e.x, e.y, e.z, e.hp]),
    deathCache: game.deathCache ? { x: game.deathCache.x, y: game.deathCache.y, z: game.deathCache.z,
                                    slots: game.deathCache.slots, dispSlot: game.deathCache.dispSlot } : null,
  };
  try { saveWorldData(game.worldId, data); game.savePending = false; }
  catch (err) { toast('save failed: ' + err.message); }
}

function startWorld(id){
  const data = loadWorldData(id);
  if (!data){ toast('world data missing'); return; }
  const ixEntry = worldIndex().find(w => w.id === id);
  game.worldId = id;
  game.worldName = data.name || (ixEntry && ixEntry.name) || 'world';
  game.seedStr = String(data.seed);
  game.seed = CORE.hashSeed(game.seedStr);
  game.edits = CORE.deserializeEdits(data.edits || []);
  game.mode = data.mode || 'creative';   // pre-survival saves stay creative
  game.slots = data.slots ? data.slots.map(reviveItem) : defaultSlots(game.mode);
  if (data.dispSlot !== undefined){
    game.dispSlot = data.dispSlot;
  } else {
    // older save (or fresh world): pull the first dispenser out of the slots
    game.dispSlot = null;
    for (let i = 0; i < game.slots.length; i++){
      if (game.slots[i] && game.slots[i].kind === 'disp'){
        game.dispSlot = game.slots[i]; game.slots[i] = null; break;
      }
    }
    if (!game.dispSlot && !data.slots) game.dispSlot = CORE.makeDispenser(game.mode === 'creative' ? 4 : 0);
  }
  game.hp = data.hp == null ? 100 : data.hp;
  game.food = data.food == null ? 100 : data.food;
  game.timeOfDay = data.timeOfDay == null ? 0.2 : data.timeOfDay;
  game.torches = (data.torches || []).map(t => [t[0], t[1], t[2]]);
  game.doors = (data.doors || []).map(d => ({ x: d[0], y: d[1], z: d[2], yaw: d[3], open: !!d[4] }));
  game.tables = (data.tables || []).map(t => [t[0], t[1], t[2]]);
  game.removedTreeSet = new Set(data.removedTrees || []);
  game.entities = (data.entities || []).map(r => reviveEntity(r[0], r[1], r[2], r[3], r[4]));
  game.deathCache = data.deathCache || null;
  game.undoStack = [];
  game.tool = Object.assign({ shape: 0, size: 1.5, dist: 4.5, mode: 'build', rot: 0 }, data.tool || {});
  game.tool.size = Math.min(CORE.SIZE_MAX, Math.max(CORE.SIZE_MIN, game.tool.size));
  game.tool.dist = Math.min(PLAYER.reach, Math.max(1.0, game.tool.dist));
  game.hotSel = data.hotSel | 0;
  game.snapOn = !!data.snapOn;
  game.gridIdx = Math.min(9, Math.max(0, data.gridIdx | 0));
  const p = data.player || {};
  game.gen = CORE.makeGen(game.seed);
  const spawnY = game.gen.height(0, 0) + 1.5;
  game.pos.set(p.x || 0, p.y == null ? spawnY : p.y, p.z || 0);
  // terrain gen changed under an old save? lift the player out of the ground
  for (let i = 0; i < 80 && CORE.evalSDF(game.pos.x, game.pos.y + 0.9, game.pos.z, game.edits, game.gen) < 0; i++){
    game.pos.y += 0.5;
  }
  game.yaw = p.yaw || 0; game.pitch = p.pitch || 0;
  game.fly = !!p.fly;
  game.vel.set(0, 0, 0);
  game.mouseL = false; game.keys = Object.create(null);
  game.ui = 'none';

  hide('mainmenu'); hide('worldsmenu'); show('hud');
  buildScene();
  game.terrain.edits = game.edits;
  torchSys.rebuild();
  doorSys.rebuild();
  tableSys.rebuild();
  treeSys.refresh();
  game.cacheMarker = null;
  updateCacheMarker();
  $('statbars').classList.toggle('hidden', game.mode !== 'survival');
  buildHotbar(); refreshToolHUD();
  game.running = true;
  game.forceStream = true;
  requestLock();
}
function reviveItem(it){
  return it || null;
}
function quitToTitle(){
  saveNow();
  for (const e of game.entities) e.mesh = null;
  game.running = false;
  hide('pausemenu'); hide('hud');
  if (game.terrain) game.terrain.disposeAll();
  if (game.scene){
    game.scene.clear();
  }
  game.ui = 'none';
  show('mainmenu');
}

// ---------- main loop ----------
let lastT = performance.now();
let lastChunk = null;
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  if (!game.running || !game.scene){ return; }

  if (game.ui === 'none'){
    updatePlayer(dt);
    updateGhostDist(dt);
    updateGhost();
    tryAction(dt, now);
  }
  updateViewmodel(dt);
  updateChargeBar();

  // stream chunks when crossing chunk borders (or forced)
  const cc = game.terrain.chunkOfWorld(game.pos.x, game.pos.z);
  const ck = cc[0] + ',' + cc[1];
  if (ck !== lastChunk || game.forceStream){
    lastChunk = ck; game.forceStream = false;
    game.terrain.update(game.pos.x, game.pos.y, game.pos.z);
    treeSys.refresh();
  }
  // adaptive meshing budget: clear big backlogs (world load, long teleports)
  // faster at the cost of brief hitches nobody can see terrain through anyway
  game.terrain.process(game.terrain.dirty.size > 150 ? 12 : 6);

  game.terrainMat.uniforms.uPlayerPos.value.copy(game.camera.position);
  updateDayNight(dt);
  if (game.ui === 'none') updateEntities(dt, now);
  torchSys.updateUniforms(now);
  updateSurvival(dt);
  Particles.update(dt);
  if (game.mode === 'survival'){
    $('hpfill').style.width = game.hp.toFixed(0) + '%';
    $('foodfill').style.width = game.food.toFixed(0) + '%';
  }
  if (game.cacheMarker){
    game.cacheMarker.rotation.y += dt * 2;
    game.cacheMarker.scale.setScalar(1 + Math.sin(now * 0.004) * 0.15);
  }

  // cave ambience + compass, throttled
  game.navT = (game.navT || 0) + dt;
  if (game.navT > 0.2){
    game.navT = 0;
    const depth = game.gen.height(game.pos.x, game.pos.z) - game.pos.y;
    AudioSys.setAmbience(Math.min(1, Math.max(0, (depth - 3) / 10)));
    // the sky itself goes black as you descend — caves feel enclosed and
    // not-yet-meshed frontier chunks never flash bright blue in the dark
    const skyF = Math.min(1, Math.max(0.02, 1 - (depth - 2) / 8));
    game.scene.background.copy(game.skyNow || SKY).multiplyScalar(skyF);
    const dist = Math.hypot(game.pos.x, game.pos.z);
    const thv = Math.atan2(-game.pos.x, -game.pos.z);
    const thf = Math.atan2(-Math.sin(game.yaw), -Math.cos(game.yaw));
    $('navarrow').style.transform = 'rotate(' + (-(thv - thf) * 180 / Math.PI).toFixed(0) + 'deg)';
    $('navdist').textContent = '\u2302 ' + Math.round(dist) + 'm';
    let posTxt = Math.round(game.pos.x) + ' ' + Math.round(game.pos.y) + ' ' + Math.round(game.pos.z);
    if (game.deathCache){
      const c = game.deathCache;
      posTxt += ' · \u2620 ' + Math.round(Math.hypot(c.x - game.pos.x, c.z - game.pos.z)) + 'm';
    }
    $('navpos').textContent = posTxt;
  }

  // autosave: 2.5s after last change
  if (game.savePending && now - game.saveTimer > 2500) saveNow();

  game.renderer.render(game.scene, game.camera);

  game.fpsAcc += dt; game.fpsN++;
  if (game.fpsAcc >= 0.5){
    game.fps = Math.round(game.fpsN / game.fpsAcc);
    $('fpsbox').textContent = game.fps + ' fps' + (game.terrain.dirty.size ? ' · meshing ' + game.terrain.dirty.size : '');
    game.fpsAcc = 0; game.fpsN = 0;
  }
}

// ---------- boot ----------
function bindMenus(){
  $('btnWorlds').addEventListener('click', () => { hide('mainmenu'); refreshWorldList(); show('worldsmenu'); });
  $('btnWorldsBack').addEventListener('click', () => { hide('worldsmenu'); show('mainmenu'); });
  $('btnCreateWorld').addEventListener('click', createWorld);
  $('modeSurvival').addEventListener('click', () => { newWorldMode = 'survival';
    $('modeSurvival').classList.add('sel'); $('modeCreative').classList.remove('sel'); });
  $('modeCreative').addEventListener('click', () => { newWorldMode = 'creative';
    $('modeCreative').classList.add('sel'); $('modeSurvival').classList.remove('sel'); });
  $('btnOptionsMain').addEventListener('click', () => openOptions('main'));
  $('btnOptionsBack').addEventListener('click', closeOptions);
  $('btnQuit').addEventListener('click', () => { window.close(); toast('close the tab to quit'); });
  $('btnDelYes').addEventListener('click', () => {
    if (pendingDelete){
      saveWorldIndex(worldIndex().filter(w => w.id !== pendingDelete.id));
      deleteWorldData(pendingDelete.id);
      pendingDelete = null; refreshWorldList();
    }
    hide('confirmdel');
  });
  $('btnDelNo').addEventListener('click', () => { pendingDelete = null; hide('confirmdel'); });
  $('btnResume').addEventListener('click', resumeGame);
  $('btnPauseOptions').addEventListener('click', () => openOptions('pause'));
  $('btnSaveQuit').addEventListener('click', quitToTitle);
  $('btnCraftClose').addEventListener('click', closeOverlay);
  $('btnRespawn').addEventListener('click', respawn);
  for (const id of ['optSens', 'optFov', 'optRd', 'optVol']) $(id).addEventListener('input', syncOptLabels);
  window.addEventListener('beforeunload', () => { if (game.running) saveNow(); });
}

initRenderer();
bindInput();
bindInvDnD();
bindMenus();
requestAnimationFrame(frame);

// debug handles (also used by the headless smoke test)
window.__game = game;
window.__CORE = CORE;
window.__api = { activeTool, doMine, doPlace, undoEdit, pickMaterial, refreshHotbar, refreshToolHUD,
  spawnEntity, hurtEntity, damagePlayer, respawn, torchSys, tryEat, updateDayNight,
  treeSys, doorSys, tableSys, nearTable, sdfWorld, capsuleFree, surfaceHit };
</script>
