<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>STRATA</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{
  --ui-bg: rgba(18,16,24,0.92);
  --ui-bg2: rgba(30,28,40,0.95);
  --ui-border:#4a4458;
  --ui-hi:#8f86ad;
  --ui-text:#e8e4f0;
  --accent:#6fd3ff;
}
*{box-sizing:border-box; margin:0; padding:0; user-select:none; -webkit-user-select:none;}
html,body{width:100%;height:100%;overflow:hidden;background:#0b0a10;}
body{font-family:"Courier New",ui-monospace,monospace; color:var(--ui-text); font-size:14px;}
canvas.game{display:block; image-rendering:pixelated;}
.hidden{display:none !important;}

/* ---------- generic panel ---------- */
.screen{position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:40;}
.screen.dim{background:rgba(5,4,10,0.72);}
.panel{background:var(--ui-bg); border:2px solid var(--ui-border); padding:22px 26px; min-width:340px; max-width:80vw; max-height:86vh; overflow:auto; box-shadow:0 0 0 2px #111 , 0 12px 40px rgba(0,0,0,.6); image-rendering:pixelated;}
.panel h1{font-size:34px; letter-spacing:8px; text-align:center; margin-bottom:6px; color:#fff; text-shadow:0 3px 0 #2c2838;}
.panel h2{font-size:18px; letter-spacing:3px; margin-bottom:14px; text-align:center; color:var(--ui-hi);}
.panel .sub{ text-align:center; color:var(--ui-hi); margin-bottom:18px; font-size:12px; letter-spacing:2px;}
.btn{display:block; width:100%; text-align:center; background:var(--ui-bg2); border:2px solid var(--ui-border); color:var(--ui-text); padding:10px 14px; margin:8px 0; font:inherit; font-size:15px; letter-spacing:2px; cursor:pointer;}
.btn:hover{border-color:var(--accent); color:#fff; background:#3a3550;}
.btn.small{padding:5px 8px; font-size:12px; margin:0; width:auto; display:inline-block;}
.btn.danger:hover{border-color:#ff6f6f; color:#ffb3b3;}
.row{display:flex; gap:8px; align-items:center;}
input[type=text]{background:#141220; border:2px solid var(--ui-border); color:var(--ui-text); font:inherit; padding:8px; width:100%;}
input[type=text]:focus{outline:none; border-color:var(--accent);}
input[type=range]{width:180px; accent-color:var(--accent);}
.optrow{display:flex; justify-content:space-between; align-items:center; margin:10px 0; gap:18px;}
.optrow label{letter-spacing:1px;}
.optrow .val{width:52px; text-align:right; color:var(--accent);}

/* ---------- worlds list ---------- */
.worldlist{margin:10px 0; max-height:40vh; overflow:auto;}
.worlditem{display:flex; justify-content:space-between; align-items:center; gap:10px; border:2px solid var(--ui-border); background:var(--ui-bg2); padding:8px 10px; margin:6px 0;}
.worlditem .wname{font-size:15px;}
.worlditem .wmeta{font-size:11px; color:var(--ui-hi);}
.modebtn{margin:0;}
.modebtn.sel{border-color:var(--accent); color:#fff;}

/* ---------- HUD ---------- */
#hud{position:fixed; inset:0; pointer-events:none; z-index:20;}
#statbars{position:absolute; left:50%; bottom:88px; transform:translateX(-50%); display:flex; gap:10px; width:552px; justify-content:space-between;}
.statbar{width:220px; height:12px; background:rgba(10,9,16,0.75); border:2px solid var(--ui-border);}
.statfill{height:100%;}
.statfill.hp{background:#e04545; width:100%;}
.statfill.food{background:#c8a24b; width:100%;}
#hurt{position:fixed; inset:0; pointer-events:none; background:radial-gradient(ellipse at center, transparent 40%, rgba(200,20,20,0.55) 100%); opacity:0; transition:opacity .12s;}
#chargebar{position:absolute; left:50%; bottom:74px; transform:translateX(-50%); width:180px; height:10px; background:rgba(10,9,16,0.7); border:2px solid var(--ui-border); display:none;}
#chargefill{height:100%; width:0%; background:var(--accent);}
#toolinfo{position:absolute; left:14px; bottom:14px; background:rgba(10,9,16,0.6); border:2px solid rgba(74,68,88,0.6); padding:8px 12px; font-size:13px; line-height:1.5; letter-spacing:1px;}
#toolinfo .t1{color:#fff; font-size:14px;}
#toolinfo .t2{color:var(--ui-hi);}
#toolinfo .on{color:var(--accent);}
#fpsbox{position:absolute; right:14px; top:12px; color:var(--ui-hi); font-size:12px; background:rgba(10,9,16,0.5); padding:3px 8px; border:2px solid rgba(74,68,88,0.5);}
#navbox{position:absolute; left:50%; top:12px; transform:translateX(-50%); display:flex; gap:8px; align-items:center; color:var(--ui-hi); font-size:12px; background:rgba(10,9,16,0.5); padding:3px 10px; border:2px solid rgba(74,68,88,0.5); letter-spacing:1px;}
#navarrow{display:inline-block; color:var(--accent); font-size:13px;}

/* ---------- hotbar ---------- */
#hotbar{position:absolute; left:50%; bottom:12px; transform:translateX(-50%); display:flex; gap:4px;}
.slot{width:52px; height:52px; background:rgba(20,18,30,0.85); border:2px solid var(--ui-border); position:relative; image-rendering:pixelated;}
.slot img{width:100%; height:100%; image-rendering:pixelated; display:block;}
.slot .cnt{position:absolute; right:2px; bottom:1px; font-size:11px; color:#fff; text-shadow:1px 1px 0 #000; pointer-events:none;}
.slot .key{position:absolute; left:3px; top:1px; font-size:10px; color:var(--ui-hi); pointer-events:none;}
.slot.sel{border-color:#fff; box-shadow:0 0 0 2px var(--accent);}

/* ---------- inventory ---------- */
#invscreen .panel{min-width:unset;}
.invgrid{display:grid; grid-template-columns:repeat(10,52px); gap:4px; margin:6px 0;}
.invlabel{font-size:11px; color:var(--ui-hi); letter-spacing:2px; margin-top:10px;}
.slot.drop-ok{border-color:#7dff9b;}
#draggy{position:fixed; width:52px; height:52px; pointer-events:none; z-index:99; image-rendering:pixelated; display:none;}
#draggy img{width:100%;height:100%;image-rendering:pixelated;}

/* ---------- crafting ---------- */
.craftrow{display:flex; align-items:center; gap:10px; border:2px solid var(--ui-border); background:var(--ui-bg2); padding:6px 10px; margin:6px 0;}
.craftrow img{width:36px; height:36px; image-rendering:pixelated;}
.craftrow .cname{flex:1;}
.craftrow .ccost{font-size:12px; color:var(--ui-hi);}
.craftrow .ccost.ok{color:#7dff9b;}

/* ---------- toast ---------- */
#toast{position:fixed; left:50%; bottom:86px; transform:translateX(-50%); background:rgba(10,9,16,0.85); border:2px solid var(--ui-border); padding:6px 14px; letter-spacing:1px; z-index:60; transition:opacity .3s; opacity:0; pointer-events:none;}

/* ---------- fatal ---------- */
#fatal{z-index:100; background:#14060a;}
#fatal .panel{border-color:#a33;}
#fatal pre{white-space:pre-wrap; color:#ff9b9b; font-size:12px; margin:10px 0; max-width:60vw;}
</style>
</head>

  <div id="statbars" class="hidden">
    <div class="statbar"><div id="hpfill" class="statfill hp"></div></div>

<div id="invscreen" class="screen hidden dim">
  <div class="panel">

    <div class="invlabel">DISPENSER SLOT</div>

</div>

<script>
// Fatal-error surface: catches anything, including failures before/inside the
// module script (e.g. CDN not reachable). Never a silent black screen.
window.__strataFatal = function(msg){
  document.getElementById('fatalmsg').textContent = String(msg);
  document.getElementById('fatal').classList.remove('hidden');
};
window.addEventListener('error', function(e){
  if (!window.__strataBooted) window.__strataFatal(e.message || 'unknown error');
});
window.addEventListener('unhandledrejection', function(e){
  if (!window.__strataBooted) window.__strataFatal((e.reason && e.reason.message) || e.reason || 'unhandled rejection');
});
document.getElementById('btnRetry').addEventListener('click', function(){ location.reload(); });
</script>

<script type="module">
// STRATA — blockless mining sandbox. Build 1.
// Terrain is a signed distance field: base flat plane + ordered CSG edit list,
// clamped so everything below bedrock is permanently solid. Meshed with dual
// contouring (QEF vertices) so cube brushes cut sharp 90° corners.

// ===================== STRATA CORE BEGIN =====================
// Pure logic — no THREE, no DOM. Extracted verbatim and run under node for
// headless tests (see tests in repo history / test harness).
const CORE = (function(){
'use strict';

// ---- world constants ----
const VOX = 0.5;              // voxel edge in meters
const N = 16;                 // cells per chunk edge
const CHUNK_M = N * VOX;      // chunk edge in meters (8)
const SURFACE_Y = 0.01;       // base rock plane (off-grid to avoid exact-zero samples)
const BEDROCK_Y = -63.99;     // everything below is permanently solid
const CY_MIN = -8, CY_MAX = 5; // vertical chunk range: y in [-64, +48) meters

// materials (0 = air / none)
const MAT = { ROCK:1, BEDROCK:2, IRON:3, RUBY:4, OBSIDIAN:5, DIAMOND:6, GRASS:7, SAND:8, GLOWSHROOM:9, WOOD:10, STICK:11 };
const NMAT = 11;
const MAT_NAME = ['','rock','bedrock','iron','ruby','obsidian','diamond','grass','sand','glowshroom','wood','sticks'];

// ---- tools ----
const TIER_NAME = ['stone','iron','ruby','obsidian','diamond'];
// discrete size steps (diameter for spheres, edge for cubes)
const STEPS = [0.375, 0.5, 0.75, 1, 1.25, 1.5, 2, 2.5, 3, 4, 5, 6, 8];
// tier t (0..3) unlocks STEPS[tierMin(t) .. tierMax(t)]; diamond (4) is continuous
function tierMin(t){ return t >= 4 ? 0 : 4 - t; }
function tierMax(t){ return t >= 4 ? STEPS.length - 1 : 8 + t; }
const SIZE_MIN = STEPS[0], SIZE_MAX = STEPS[STEPS.length - 1];
// seconds to break/build one shape (like Minecraft block mine time);
// diamond (tier 4) is instant: the whole shape goes in one click
const TIER_TIME = [1.1, 0.8, 0.55, 0.32, 0];

// grid snap presets, keys 1..0 while holding F
const GRID_SIZES = [0.25, 0.5, 0.75, 1, 1.5, 2, 3, 4, 6, 8];

// ---- seeded noise ----
function hashInt(a){
  a |= 0;
  a = Math.imul(a ^ (a >>> 16), 0x45d9f3b);
  a = Math.imul(a ^ (a >>> 16), 0x45d9f3b);
  return (a ^ (a >>> 16)) >>> 0;
}
function hashLat(a){
  a = Math.imul(a ^ (a >>> 15), 0x2c1b3c6d);
  return ((a ^ (a >>> 12)) >>> 0);
}
function latt2(seed, x, z){
  return hashLat(seed ^ Math.imul(x, 0x9E3779B1) ^ Math.imul(z, 0x85EBCA77)) / 4294967296;
}
function latt3(seed, x, y, z){
  return hashLat(seed ^ Math.imul(x, 0x9E3779B1) ^ Math.imul(y, 0xC2B2AE3D) ^ Math.imul(z, 0x85EBCA77)) / 4294967296;
}
function sm(t){ return t * t * (3 - 2 * t); }
function sstep(a, b, t){ const u = Math.min(1, Math.max(0, (t - a) / (b - a))); return u * u * (3 - 2 * u); }
function noise2(seed, x, z){
  const x0 = Math.floor(x), z0 = Math.floor(z);
  const fx = sm(x - x0), fz = sm(z - z0);
  const a = latt2(seed, x0, z0),     b = latt2(seed, x0 + 1, z0);
  const c = latt2(seed, x0, z0 + 1), d = latt2(seed, x0 + 1, z0 + 1);
  return a + (b - a) * fx + (c - a) * fz + (a - b - c + d) * fx * fz;
}
function noise3(seed, x, y, z){
  const x0 = Math.floor(x), y0 = Math.floor(y), z0 = Math.floor(z);
  const fx = sm(x - x0), fy = sm(y - y0), fz = sm(z - z0);
  const n000 = latt3(seed, x0, y0, z0),         n100 = latt3(seed, x0 + 1, y0, z0);
  const n010 = latt3(seed, x0, y0 + 1, z0),     n110 = latt3(seed, x0 + 1, y0 + 1, z0);
  const n001 = latt3(seed, x0, y0, z0 + 1),     n101 = latt3(seed, x0 + 1, y0, z0 + 1);
  const n011 = latt3(seed, x0, y0 + 1, z0 + 1), n111 = latt3(seed, x0 + 1, y0 + 1, z0 + 1);
  const nx00 = n000 + (n100 - n000) * fx, nx10 = n010 + (n110 - n010) * fx;
  const nx01 = n001 + (n101 - n001) * fx, nx11 = n011 + (n111 - n011) * fx;
  const nxy0 = nx00 + (nx10 - nx00) * fy, nxy1 = nx01 + (nx11 - nx01) * fy;
  return nxy0 + (nxy1 - nxy0) * fz;
}
function fbm2(seed, x, z, oct){
  let v = 0, amp = 0.5, f = 1, tot = 0;
  for (let i = 0; i < oct; i++){
    v += noise2(seed + i * 1013, x * f, z * f) * amp;
    tot += amp; amp *= 0.5; f *= 2;
  }
  return v / tot;
}

// ---- world generation ----
// gen interface: { height(x,z), heightRange(x0,z0,x1,z1), sdf(x,y,z),
//   mat(x,y,z), makeLocal(x0,z0,x1,z1), caves }
// Everything derives deterministically from the seed; the same interface with
// a flat plane (FLAT_GEN) is the default so build-1 behavior and tests hold.
const ORE_TYPES = [
  { mat: MAT.IRON,       yMin: -30,   yMax: -4,   p: 0.50, rMin: 0.8, rMax: 1.5 },
  { mat: MAT.RUBY,       yMin: -45,   yMax: -16,  p: 0.38, rMin: 0.7, rMax: 1.3 },
  { mat: MAT.OBSIDIAN,   yMin: -58,   yMax: -30,  p: 0.34, rMin: 0.7, rMax: 1.3 },
  { mat: MAT.DIAMOND,    yMin: -63.5, yMax: -46,  p: 0.28, rMin: 0.6, rMax: 1.1 },
  { mat: MAT.GLOWSHROOM, yMin: -20,   yMax: -1,   p: 0.48, rMin: 0.5, rMax: 0.9 },
];
const VEIN_CELL = 4;
function makeGen(seed){
  seed = seed >>> 0;
  const sH = hashInt(seed ^ 0x68e31da4), sR = hashInt(seed ^ 0xb5297a4d);
  const sB = hashInt(seed ^ 0x1b56c4e9), sD = hashInt(seed ^ 0x7feb352d);
  const sA = hashInt(seed ^ 0x846ca68b), sC = hashInt(seed ^ 0x9e3779b9);
  const sV = hashInt(seed ^ 0x2545f491), sW = hashInt(seed ^ 0x3c6ef372);
  const sE = hashInt(seed ^ 0xdaa66d2b), sM = hashInt(seed ^ 0x14057b7f);

  function biome(x, z){ return fbm2(sB, x * 0.0045, z * 0.0045, 2); }
  function height(x, z){
    const b = biome(x, z);
    const base = fbm2(sH, x * 0.02, z * 0.02, 3) - 0.5;
    const hillW = sstep(0.32, 0.52, b);
    const mtnW = sstep(0.56, 0.78, b);
    const amp = 2.5 + 7 * hillW + 5 * mtnW;
    let h = base * 2 * amp;
    if (mtnW > 0){
      const r = 1 - Math.abs(2 * fbm2(sR, x * 0.011, z * 0.011, 3) - 1);
      h += mtnW * r * r * 24;
    }
    return Math.max(-6, Math.min(30, h));
  }
  function isDesert(x, z){
    return fbm2(sD, x * 0.004 + 37.7, z * 0.004, 2) > 0.62 && biome(x, z) < 0.45;
  }
  // Caves = union of two carve systems, each unique by position:
  //  - spaghetti tunnels (intersection band of two 3D noises) whose width
  //    varies regionally and grows with depth
  //  - blobby caverns, larger and more common at depth
  // Near the surface both are faded out — EXCEPT in entrance zones (a 2D
  // noise mask), where tunnels are allowed to climb out and breach the
  // ground, so cave systems are actually discoverable from above.
  // Returns a value < 0 inside carved space; the fade keeps it continuous.
  function entranceMask(x, z){
    return sstep(0.57, 0.70, noise2(sE, x * 0.016, z * 0.016));
  }
  function caveCarve(x, y, z, h){
    const depth = h - y;
    let fade = 0, mouth = 0;
    if (depth < 6){
      const ent = entranceMask(x, z);
      fade = (6 - depth) * 0.09 * (1 - ent);
      // flare entrance throats open near the skin: without this, breaches
      // taper to sub-player width right where you'd climb in
      mouth = Math.max(ent, 0.45) * Math.max(0, 1 - depth / 5) * 0.09;
    }
    const nA = noise3(sA, x * 0.045, y * 0.055, z * 0.045);
    const nB = noise3(sC, x * 0.045 + 53.1, y * 0.055, z * 0.045 + 11.7);
    const width = noise3(sW, x * 0.012, y * 0.012, z * 0.012);
    const tunnelT = 0.72 - width * 0.08 - Math.min(depth, 55) * 0.0008 - mouth;
    const tunnel = (tunnelT + fade) - Math.min(nA, nB);
    const nR = noise3(sM, x * 0.02, y * 0.026, z * 0.02);
    const roomT = 0.865 - Math.min(depth, 55) * 0.0016;
    const room = (roomT + fade * 0.8) - nR;
    // scales calibrated against measured true wall distances so the field
    // reports honest meters — the capsule collider depends on it (with the
    // old 4x scale a 2m tunnel read as ~0.3m and no cave was enterable)
    return Math.min(tunnel * 22, room * 34);
  }
  function sdfFromH(h, x, y, z){
    const d = (y - h) * 0.65;
    if (d > 2.5) return d;
    if (d > 0.05){
      // Above the heightfield the naive answer is "surface d below you" —
      // but over a cave mouth that surface is carved away, and returning d
      // builds an invisible floor the collider bounces on. Near entrance
      // zones, keep taking max with the carve so the air over a hole knows
      // the nearest solid is the rim, not the missing ground.
      if (entranceMask(x, z) < 0.15) return d;
    }
    return Math.max(d, -caveCarve(x, y, z, h));
  }
  function sdf(x, y, z){ return sdfFromH(height(x, z), x, y, z); }
  function oreAt(x, y, z){
    if (y > -1 || y < BEDROCK_Y) return 0;
    const cx = Math.floor(x / VEIN_CELL), cy = Math.floor(y / VEIN_CELL), cz = Math.floor(z / VEIN_CELL);

uniform vec3 uPlayerPos;
uniform float uLampR;
uniform float uLampSky;
uniform vec4 uTorch[16];
uniform float uTorchN;
varying vec3 vPos;
varying vec3 vNrm;
varying float vMat;
varying float vSky;
void main(){
  vec3 n = normalize(vNrm);
  vec3 an = abs(n);
  // dominant-axis triplanar: single plane, no blend -> crisp pixel tiling
  vec2 uv;
  if (an.y >= an.x && an.y >= an.z)      uv = vPos.xz;
  else if (an.x >= an.z)                 uv = vPos.zy;
  else                                   uv = vPos.xy;
  float m = floor(vMat + 0.5);
  float fx = clamp(fract(uv.x), 0.5/16.0, 15.5/16.0);
  float fy = clamp(fract(uv.y), 0.5/16.0, 15.5/16.0);
  vec4 tex = texture2D(uAtlas, vec2((m + fx) / uNMat, fy));
  float diff = max(dot(n, uSunDir), 0.0);
  float upAmb = 0.85 + 0.15 * n.y;       // cheap sky-occlusion feel
  vec3 dayLit = min(uAmbCol * upAmb + uSunCol * diff, vec3(1.05));
  // headlamp: its own warm light, strongest where the day light isn't
  float lampD = length(vPos - uPlayerPos);
  float lamp = clamp(1.0 - lampD / uLampR, 0.0, 1.0);
  lamp = lamp * lamp * (3.0 - 2.0 * lamp);
  vec3 lampLit = vec3(1.0, 0.94, 0.80) * (0.85 * lamp * (1.0 - vSky * uLampSky));
  // placed torches
  float tl = 0.0;
  for (int i = 0; i < 16; i++){
    if (float(i) >= uTorchN) break;
    float td = length(vPos - uTorch[i].xyz);
    float t = clamp(1.0 - td / uTorch[i].w, 0.0, 1.0);
    tl = max(tl, t * t * (3.0 - 2.0 * t));
  }
  vec3 torchLit = vec3(1.0, 0.72, 0.42) * (0.9 * tl);
  vec3 col = tex.rgb * min(dayLit * vSky + lampLit + torchLit + vec3(0.02), vec3(1.05));
  // ores shimmer faintly in the dark so veins catch the eye
  float dark = 1.0 - min(vSky, 1.0) * (uLampSky / 0.85);
  if (m >= 2.0 && m <= 5.0) col = max(col, tex.rgb * 0.42 * dark);
  if (m == 8.0) col = max(col, tex.rgb * 0.75 * (0.35 + 0.65 * dark));  // glowshroom glows
  float dist = gl_FragCoord.z / gl_FragCoord.w;
  float fog = smoothstep(uFogNear, uFogFar, dist);
  vec3 fogC = uFogCol * max(vSky, 0.03);  // fog goes black at depth
  gl_FragColor = vec4(mix(col, fogC, fog), 1.0);
}`;

// ---------- chunk manager ----------
const CK = (cx, cy, cz) => cx + ',' + cy + ',' + cz;

class Terrain {
  constructor(scene, material, edits, gen){
    this.scene = scene;
    this.material = material;
    this.edits = edits;              // live reference to world edit list
    this.gen = gen;
    this.chunks = new Map();         // key -> {mesh|null}
    this.dirty = new Map();          // key -> [cx,cy,cz], pending remesh
    this.center = [0, 0, 0];         // chunk coords of player (x,y,z)
    this.radius = 3;
  }
  chunkOfWorld(x, z){ return [Math.floor(x / CORE.CHUNK_M), Math.floor(z / CORE.CHUNK_M)]; }

  // stream chunks around player; returns true if set changed
  update(px, py, pz){
    const [ccx, ccz] = this.chunkOfWorld(px, pz);
    this.center = [ccx, Math.floor(py / CORE.CHUNK_M), ccz];
    const want = new Set();
    const R = this.radius;
    for (let dz = -R; dz <= R; dz++)
      for (let dx = -R; dx <= R; dx++){
        if (dx*dx + dz*dz > (R + 0.5) * (R + 0.5)) continue;
        for (let cy = CORE.CY_MIN; cy <= CORE.CY_MAX; cy++)
          want.add(CK(ccx + dx, cy, ccz + dz));
      }
    // drop far chunks
    for (const [key, ch] of this.chunks){
      if (!want.has(key)){
        if (ch.mesh){ this.scene.remove(ch.mesh); ch.mesh.geometry.dispose(); }
        this.chunks.delete(key);
        this.dirty.delete(key);
      }
    }
    // queue new chunks
    for (const key of want){
      if (!this.chunks.has(key)){
        this.chunks.set(key, { mesh: null });
        const [cx, cy, cz] = key.split(',').map(Number);
        this.dirty.set(key, [cx, cy, cz]);
      }
    }
  }

  // mark chunks overlapping an edit AABB dirty
  invalidate(e){
    const box = CORE.editAABB(e);
    const pad = CORE.VOX * 2;
    const x0 = Math.floor((box[0] - pad) / CORE.CHUNK_M), x1 = Math.floor((box[3] + pad) / CORE.CHUNK_M);
    const y0 = Math.floor((box[1] - pad) / CORE.CHUNK_M), y1 = Math.floor((box[4] + pad) / CORE.CHUNK_M);
    const z0 = Math.floor((box[2] - pad) / CORE.CHUNK_M), z1 = Math.floor((box[5] + pad) / CORE.CHUNK_M);
    for (let cz = z0; cz <= z1; cz++)
      for (let cy = Math.max(y0, CORE.CY_MIN); cy <= Math.min(y1, CORE.CY_MAX); cy++)
        for (let cx = x0; cx <= x1; cx++){
          const key = CK(cx, cy, cz);
          if (this.chunks.has(key)) this.dirty.set(key, [cx, cy, cz]);
        }
  }

  // remesh dirty chunks within a per-frame time budget (ms). nearest first.
  process(budgetMs){
    if (this.dirty.size === 0) return;
    const t0 = performance.now();
    const entries = [...this.dirty.entries()];
    const [cx, cy, cz] = this.center;
    entries.sort((A, B) => {
      const da = (A[1][0]-cx)**2 + (A[1][1]-cy)**2 + (A[1][2]-cz)**2;
      const db = (B[1][0]-cx)**2 + (B[1][1]-cy)**2 + (B[1][2]-cz)**2;
      return da - db;
    });
    for (const [key, c] of entries){
      if (performance.now() - t0 > budgetMs) break;
      this.dirty.delete(key);
      this.remesh(key, c[0], c[1], c[2]);
    }
  }

  remesh(key, cx, cy, cz){
    const ch = this.chunks.get(key);
    if (!ch) return;
    const data = CORE.meshChunk(cx, cy, cz, this.edits, this.gen);
    if (ch.mesh){ this.scene.remove(ch.mesh); ch.mesh.geometry.dispose(); ch.mesh = null; }
    if (!data) return;
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(data.positions, 3));
    g.setAttribute('normal', new THREE.BufferAttribute(data.normals, 3));
    g.setAttribute('aMat', new THREE.BufferAttribute(data.mats, 1));
    g.setAttribute('aSky', new THREE.BufferAttribute(data.skys, 1));
    const mesh = new THREE.Mesh(g, this.material);
    mesh.frustumCulled = true;
    g.computeBoundingSphere();
    this.scene.add(mesh);
    ch.mesh = mesh;
  }

  disposeAll(){
    for (const [, ch] of this.chunks){
      if (ch.mesh){ this.scene.remove(ch.mesh); ch.mesh.geometry.dispose(); }
    }
    this.chunks.clear(); this.dirty.clear();
  }
}

function playerHeight(){ return game.crouch ? PLAYER.crouchHeight : PLAYER.height; }

// edits near a point/segment, cheap cull for physics + ghost rays
function nearEdits(box){
  return CORE.cullEdits(game.edits, box, 0.6);
}
// solid props: closed doors + crafting tables (boxes), tree trunks (cylinders)
function propSDF(x, y, z){
  let d = 1e9;
  for (const p of game.solidProps){
    let pd;
    if (p.t === 'box'){
      let dx = x - p.x, dz = z - p.z;
      if (p.yaw){
        const c = Math.cos(-p.yaw), s = Math.sin(-p.yaw);
        const rx = dx * c - dz * s;
        dz = dx * s + dz * c; dx = rx;
      }
      const qx = Math.abs(dx) - p.hx, qy = Math.abs(y - p.y) - p.hy, qz = Math.abs(dz) - p.hz;
      const ox = Math.max(qx, 0), oy = Math.max(qy, 0), oz = Math.max(qz, 0);
      pd = Math.hypot(ox, oy, oz) + Math.min(Math.max(qx, Math.max(qy, qz)), 0);
    } else {
      const d2 = Math.hypot(x - p.x, z - p.z) - p.r;
      const dy = Math.abs(y - (p.y + p.h * 0.5)) - p.h * 0.5;
      pd = Math.hypot(Math.max(d2, 0), Math.max(dy, 0)) + Math.min(Math.max(d2, dy), 0);
    }
    if (pd < d) d = pd;
  }
  return d;
}
function sdfWorld(x, y, z, edits){
  let d = CORE.evalSDF(x, y, z, edits, game.gen);
  if (game.solidProps.length) d = Math.min(d, propSDF(x, y, z));
  if (treeSys.visible && treeSys.visible.size) d = Math.min(d, treeSys.trunkNear(x, y, z));
  return d;
}
// gradient of the combined field (terrain + props)
function gradWorld(x, y, z, edits){
  const h = 0.1;
  const d0 = sdfWorld(x + h, y + h, z + h, edits);
  const d1 = sdfWorld(x + h, y - h, z - h, edits);
  const d2 = sdfWorld(x - h, y + h, z - h, edits);
  const d3 = sdfWorld(x - h, y - h, z + h, edits);
  const gx = d0 + d1 - d2 - d3, gy = d0 - d1 + d2 - d3, gz = d0 - d1 - d2 + d3;
  const len = Math.sqrt(gx*gx + gy*gy + gz*gz) || 1;
  return [gx/len, gy/len, gz/len];
}
function capsuleFree(x, y, z, edits){
  const r = PLAYER.radius, h = playerHeight();
  for (const c of [r + 0.02, h * 0.5, h - r - 0.02]){
    if (sdfWorld(x, y + c, z, edits) < r - 0.02) return false;
  }
  return true;
}

// ---------- scene setup ----------
function initRenderer(){
  const renderer = new THREE.WebGLRenderer({ antialias: false });
  renderer.outputColorSpace = THREE.LinearSRGBColorSpace; // raw colors end to end
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.domElement.className = 'game';
  document.body.insertBefore(renderer.domElement, document.body.firstChild);
  game.renderer = renderer;
  window.addEventListener('resize', () => {
    renderer.setSize(window.innerWidth, window.innerHeight);
    if (game.camera){
      game.camera.aspect = window.innerWidth / window.innerHeight;
      game.camera.updateProjectionMatrix();
    }
  });
}

const SKY = new THREE.Color(0x8fb8e8);
function buildScene(){
  const scene = new THREE.Scene();
  scene.background = SKY.clone();
  game.scene = scene;
  const cam = new THREE.PerspectiveCamera(game.opts.fov, window.innerWidth / window.innerHeight, 0.08, 400);
  cam.rotation.order = 'YXZ';
  game.camera = cam;

  game.atlas = buildAtlas(game.seed);
  const fogFar = (game.opts.rd + 1) * CORE.CHUNK_M;
  const mat = new THREE.ShaderMaterial({
    vertexShader: TERRAIN_VERT,
    fragmentShader: TERRAIN_FRAG,
    uniforms: {
      uAtlas: { value: game.atlas.tex },
      uNMat: { value: CORE.NMAT },
      uSunDir: { value: new THREE.Vector3(0.55, 0.75, 0.35).normalize() },
      uSunCol: { value: new THREE.Color(0.42, 0.40, 0.36) },
      uAmbCol: { value: new THREE.Color(0.62, 0.63, 0.68) },
      uFogCol: { value: SKY.clone() },
      uFogNear: { value: fogFar * 0.55 },
      uFogFar: { value: fogFar },
      uPlayerPos: { value: new THREE.Vector3() },
      uLampR: { value: 13 },
      uLampSky: { value: 0.85 },
      uTorch: { value: Array.from({ length: 16 }, () => new THREE.Vector4(0, -9999, 0, 1)) },
      uTorchN: { value: 0 },
    },
    side: THREE.DoubleSide,
  });
  game.terrainMat = mat;
  game.terrain = new Terrain(scene, mat, game.edits, game.gen);
  game.terrain.radius = game.opts.rd + 1;

  // ghost preview: translucent fill + wireframe, one per shape
  const ghostFill = new THREE.MeshBasicMaterial({ color: 0x6fd3ff, transparent: true, opacity: 0.22, depthWrite: false });
  const ghostLine = new THREE.LineBasicMaterial({ color: 0xcfeeff, transparent: true, opacity: 0.85 });
  const sphereG = new THREE.SphereGeometry(0.5, 20, 14);
  const cubeG = new THREE.BoxGeometry(1, 1, 1);
  const cylG = new THREE.CylinderGeometry(0.5, 0.5, 1, 20);
  game.ghostSet = {
    0: { fill: new THREE.Mesh(sphereG, ghostFill),
         wire: new THREE.LineSegments(new THREE.WireframeGeometry(new THREE.SphereGeometry(0.5, 12, 8)), ghostLine) },
    1: { fill: new THREE.Mesh(cubeG, ghostFill),
         wire: new THREE.LineSegments(new THREE.EdgesGeometry(cubeG), ghostLine) },
    2: { fill: new THREE.Mesh(cylG, ghostFill),
         wire: new THREE.LineSegments(new THREE.WireframeGeometry(new THREE.CylinderGeometry(0.5, 0.5, 1, 10, 1)), ghostLine) },
  };
  for (const k of [0, 1, 2]){
    game.ghostSet[k].fill.visible = false; game.ghostSet[k].wire.visible = false;
    game.ghostSet[k].fill.renderOrder = 5; game.ghostSet[k].wire.renderOrder = 6;
    scene.add(game.ghostSet[k].fill); scene.add(game.ghostSet[k].wire);
  }
  Particles.init(scene);
  torchSys.init(scene);
  treeSys.init(scene);
  doorSys.init(scene);
  tableSys.init(scene);

  // snap-grid visualization (rebuilt when cell size changes)
  game.gridViz = null; game.gridVizCell = 0;

  scene.add(cam);          // camera children (viewmodel) must be in the graph
  buildViewmodel(cam);
}

function updateViewmodel(dt){
  const v = game.vm; if (!v) return;
  const tool = activeTool();
  v.drill.visible = !!tool && tool.kind === 'drill';
  v.disp.visible = !!tool && tool.kind === 'disp';
  v.gun.visible = !!tool && tool.kind === 'gun';
  v.torch.visible = !!tool && (tool.kind === 'torch' || tool.kind === 'door' || tool.kind === 'table');
  v.sword.visible = !!tool && tool.kind === 'sword';
  if (!tool) return;
  if (tool.kind === 'sword'){
    v.sBlade.material.color.set(TIER_COL[tool.tier]);
    const sw = Math.max(0, 1 - (performance.now() - (game.swingT || 0)) / 260);
    v.sword.rotation.z = 0.5 - sw * 1.6;
    v.sword.rotation.x = 0.3 + sw * 0.5;
    return;
  }
  if (tool.kind === 'torch' || tool.kind === 'door' || tool.kind === 'table'){
    v.torch.children[1].material.color.setHSL(0.09, 1, 0.55 + Math.sin(performance.now() * 0.01) * 0.08);
    return;
  }
  if (tool.kind === 'gun') return;
  const tc = new THREE.Color(TIER_COL[tool.tier]);
  if (tool.kind === 'drill'){
    v.bit.material.color.copy(tc);
    if (game.mouseL && isLocked() && game.ui === 'none') v.bit.rotation.z += dt * 22;
  } else {
    v.ring.material.color.copy(tc);
    const flash = performance.now() - game.orbFlash < 320;
    v.orb.material.color.set(flash ? 0xff3b3b : MAT_COLOR[tool.mat]);
    // the orb is the ammo gauge: it shrinks as the held stack runs down
    const fill = Math.min(1, Math.max(0.45, 0.45 + tool.count / 1200));
    v.orb.scale.setScalar(fill * (1 + Math.sin(performance.now() * 0.004) * 0.07));
  }
  // walk bob
  const speed = Math.hypot(game.vel.x, game.vel.z);
  v.bob += dt * Math.min(speed, 10) * 1.6;
  v.root.position.y = -0.27 + Math.sin(v.bob) * 0.008 * Math.min(speed, 8);
}

function buildGridViz(cell){
  if (game.gridViz){ game.scene.remove(game.gridViz); game.gridViz.geometry.dispose(); game.gridViz = null; }
  const L = 5; // lines each way
  const pts = [];
  const ext = L * cell;
  for (let i = -L; i <= L; i++){
    pts.push(i*cell, 0, -ext,  i*cell, 0, ext);
    pts.push(-ext, 0, i*cell,  ext, 0, i*cell);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(pts), 3));
  const m = new THREE.LineBasicMaterial({ color: 0x6fd3ff, transparent: true, opacity: 0.28, depthWrite: false });
  game.gridViz = new THREE.LineSegments(g, m);
  game.gridViz.renderOrder = 4;
  game.gridVizCell = cell;
  game.scene.add(game.gridViz);
}

// ---------- procedural audio (no assets; built on first user gesture) ----------
const AudioSys = {
  ctx: null, master: null, noiseBuf: null,
  hum: null, humGain: null, humFilter: null, ambGain: null,
  init(){
    if (this.ctx) return true;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = (game.opts.vol == null ? 70 : game.opts.vol) / 100;
      this.master.connect(this.ctx.destination);
      const len = this.ctx.sampleRate;
      this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = this.noiseBuf.getChannelData(0);
      let last = 0;
      for (let i = 0; i < len; i++){
        const w = Math.random() * 2 - 1;
        last = (last + 0.02 * w) / 1.02;
        d[i] = w * 0.4 + last * 2.2;
      }
      // persistent drill hum (gain 0 when idle)
      this.hum = this.ctx.createOscillator();
      this.hum.type = 'sawtooth'; this.hum.frequency.value = 60;
      this.humFilter = this.ctx.createBiquadFilter();
      this.humFilter.type = 'lowpass'; this.humFilter.frequency.value = 500;
      this.humGain = this.ctx.createGain(); this.humGain.gain.value = 0;
      this.hum.connect(this.humFilter); this.humFilter.connect(this.humGain);
      this.humGain.connect(this.master);
      this.hum.start();
      // looping cave ambience, faded in with depth
      const amb = this.ctx.createBufferSource();
      amb.buffer = this.noiseBuf; amb.loop = true; amb.playbackRate.value = 0.3;
      const af = this.ctx.createBiquadFilter(); af.type = 'lowpass'; af.frequency.value = 150;
      this.ambGain = this.ctx.createGain(); this.ambGain.gain.value = 0;
      amb.connect(af); af.connect(this.ambGain); this.ambGain.connect(this.master);
      amb.start();
      return true;
    } catch (err) { this.ctx = null; return false; }
  },
  resume(){ if (this.init() && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {}); },
  setVolume(v){ if (this.master) this.master.gain.value = v / 100; },
  setHum(on, tier, progress){
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    this.humGain.gain.setTargetAtTime(on ? 0.045 + tier * 0.01 : 0, t, 0.05);
    if (on){
      this.hum.frequency.setTargetAtTime(48 + tier * 24 + progress * 65, t, 0.05);
      this.humFilter.frequency.setTargetAtTime(380 + progress * 900, t, 0.06);
    }
  },
  setAmbience(f){ if (this.ctx) this.ambGain.gain.setTargetAtTime(f * 0.05, this.ctx.currentTime, 0.5); },
  burst(o){
    if (!this.ctx) return;
    const { dur = 0.25, freq = 900, gain = 0.22, drop = 0 } = o || {};
    const t = this.ctx.currentTime;
    const src = this.ctx.createBufferSource();
    src.buffer = this.noiseBuf;
    src.playbackRate.value = 0.7 + Math.random() * 0.6;
    const f = this.ctx.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = freq;
    if (drop) f.frequency.setTargetAtTime(Math.max(120, freq - drop), t, dur * 0.5);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t, Math.random() * 0.8, dur + 0.05);
    src.stop(t + dur + 0.1);
  },
  tone(o){
    if (!this.ctx) return;
    const { freq = 600, dur = 0.08, gain = 0.1, type = 'square' } = o || {};
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    osc.type = type; osc.frequency.value = freq;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.connect(g); g.connect(this.master);
    osc.start(t); osc.stop(t + dur + 0.02);
  },
  sfx(name, arg){
    if (!this.ctx) return;
    switch (name){
      case 'break':
        this.burst({ dur: 0.32, freq: Math.max(300, 800 - (arg || 1) * 90), gain: 0.3, drop: 420 });
        this.burst({ dur: 0.14, freq: 1900, gain: 0.1 });
        break;
      case 'place': this.tone({ freq: 170, dur: 0.11, gain: 0.18, type: 'sine' }); this.burst({ dur: 0.08, freq: 900, gain: 0.09 }); break;
      case 'paint': this.burst({ dur: 0.13, freq: 2300, gain: 0.08 }); break;
      case 'deny': this.tone({ freq: 130, dur: 0.16, gain: 0.13 }); break;
      case 'toggle': this.tone({ freq: 780, dur: 0.05, gain: 0.07 }); break;
      case 'select': this.tone({ freq: 520, dur: 0.04, gain: 0.05 }); break;
      case 'craft': this.tone({ freq: 660, dur: 0.09, gain: 0.09 }); this.tone({ freq: 990, dur: 0.13, gain: 0.07 }); break;
      case 'undo': this.tone({ freq: 400, dur: 0.08, gain: 0.08, type: 'triangle' }); break;
      case 'shot': this.burst({ dur: 0.09, freq: 2600, gain: 0.28 }); this.tone({ freq: 240, dur: 0.12, gain: 0.16, type: 'sawtooth' }); break;
      case 'hit': this.burst({ dur: 0.08, freq: 700, gain: 0.16 }); break;
      case 'die': this.burst({ dur: 0.3, freq: 500, gain: 0.2, drop: 300 }); this.tone({ freq: 220, dur: 0.25, gain: 0.1, type: 'triangle' }); break;
      case 'hurt': this.tone({ freq: 110, dur: 0.2, gain: 0.2, type: 'sawtooth' }); break;
      case 'eat': this.tone({ freq: 340, dur: 0.06, gain: 0.1, type: 'sine' }); this.tone({ freq: 260, dur: 0.09, gain: 0.1, type: 'sine' }); break;
      case 'step': {
        const soft = arg === CORE.MAT.GRASS || arg === CORE.MAT.SAND;
        this.burst({ dur: soft ? 0.07 : 0.045, freq: soft ? 480 : 1500, gain: soft ? 0.06 : 0.05 });
        break;
      }
    }
  },
};

// ---------- particles (single pooled Points cloud) ----------
const Particles = {
  MAX: 800, cursor: 0, points: null, colAttr: null, posAttr: null,
  vel: null, life: null,
  init(scene){
    const pos = new Float32Array(this.MAX * 3).fill(1e6);
    this.vel = new Float32Array(this.MAX * 3);
    this.life = new Float32Array(this.MAX);
    const g = new THREE.BufferGeometry();
    this.posAttr = new THREE.BufferAttribute(pos, 3);
    this.posAttr.setUsage(THREE.DynamicDrawUsage);
    g.setAttribute('position', this.posAttr);
    this.colAttr = new THREE.BufferAttribute(new Float32Array(this.MAX * 3), 3);
    this.colAttr.setUsage(THREE.DynamicDrawUsage);
    g.setAttribute('color', this.colAttr);
    this.points = new THREE.Points(g, new THREE.PointsMaterial({ size: 0.14, vertexColors: true }));
    this.points.frustumCulled = false;
    scene.add(this.points);
  },
  burst(x, y, z, radius, colors, n, speed){
    if (!this.points || !colors.length) return;
    const P = this.posAttr.array, C = this.colAttr.array;
    for (let i = 0; i < n; i++){
      const idx = this.cursor; this.cursor = (this.cursor + 1) % this.MAX;
      const th = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1);
      const sx = Math.sin(ph) * Math.cos(th), sy = Math.cos(ph), sz = Math.sin(ph) * Math.sin(th);
      const rr = radius * Math.cbrt(Math.random());
      P[idx*3] = x + sx * rr; P[idx*3+1] = y + sy * rr; P[idx*3+2] = z + sz * rr;
      const sp = speed * (0.4 + Math.random() * 0.9);
      this.vel[idx*3] = sx * sp;
      this.vel[idx*3+1] = Math.abs(sy) * sp * 0.7 + 1.4;
      this.vel[idx*3+2] = sz * sp;
      this.life[idx] = 0.45 + Math.random() * 0.5;
      const c = new THREE.Color(colors[(Math.random() * colors.length) | 0]);
      const sh = 0.65 + Math.random() * 0.55;
      C[idx*3] = c.r * sh; C[idx*3+1] = c.g * sh; C[idx*3+2] = c.b * sh;
    }
    this.posAttr.needsUpdate = true; this.colAttr.needsUpdate = true;
  },
  update(dt){
    if (!this.points) return;
    const P = this.posAttr.array;
    let any = false;
    for (let i = 0; i < this.MAX; i++){
      if (this.life[i] <= 0) continue;
      any = true;
      this.life[i] -= dt;
      if (this.life[i] <= 0){ P[i*3+1] = 1e6; continue; }
      this.vel[i*3+1] -= 15 * dt;
      P[i*3] += this.vel[i*3] * dt;
      P[i*3+1] += this.vel[i*3+1] * dt;
      P[i*3+2] += this.vel[i*3+2] * dt;
    }
    if (any) this.posAttr.needsUpdate = true;
  },
};

// ---------- day/night ----------
const DAY_CYCLE = 600;                       // seconds per full day
const SKY_NIGHT = new THREE.Color(0x0b1020);
const SUN_BASE = new THREE.Color(0.42, 0.40, 0.36);
const AMB_DAY = new THREE.Color(0.62, 0.63, 0.68);
const AMB_NIGHT = new THREE.Color(0.10, 0.11, 0.17);
function updateDayNight(dt){
  if (game.ui === 'none') game.timeOfDay = (game.timeOfDay + dt / DAY_CYCLE) % 1;
  const phase = game.timeOfDay * Math.PI * 2;
  const sunH = Math.sin(phase);
  const dayF = Math.min(1, Math.max(0, sunH * 1.8 + 0.08));
  game.dayF = dayF;
  const u = game.terrainMat.uniforms;
  u.uSunDir.value.set(Math.cos(phase) * 0.5, Math.max(sunH, 0.12), 0.35).normalize();
  u.uSunCol.value.copy(SUN_BASE).multiplyScalar(dayF);
  u.uAmbCol.value.copy(AMB_NIGHT).lerp(AMB_DAY, dayF);
  u.uLampSky.value = 0.85 * dayF;            // headlamp works on the surface at night
  game.skyNow = (game.skyNow || new THREE.Color()).copy(SKY_NIGHT).lerp(SKY, dayF);
  u.uFogCol.value.copy(game.skyNow);
}

// ---------- torches ----------
const torchSys = {
  group: null,
  init(scene){ this.group = new THREE.Group(); scene.add(this.group); },
  rebuild(){
    if (!this.group) return;
    while (this.group.children.length){
      const c = this.group.children.pop();
      this.group.remove(c);
    }
    for (const t of game.torches){
      const g = new THREE.Group();
      const stick = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.42, 0.07), new THREE.MeshBasicMaterial({ color: 0x5a4632 }));
      stick.position.y = 0.21;
      const tip = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.14, 0.14), new THREE.MeshBasicMaterial({ color: 0xffb347 }));
      tip.position.y = 0.46;
      g.add(stick); g.add(tip);
      g.position.set(t[0], t[1], t[2]);
      this.group.add(g);
    }
  },
  add(x, y, z){ game.torches.push([x, y, z]); this.rebuild(); markSave(); },
  // remove torches near a point; returns how many were popped
  removeNear(x, y, z, r){
    const keep = [], popped = game.torches.length;
    for (const t of game.torches){
      if (Math.hypot(t[0]-x, t[1]-y, t[2]-z) > r) keep.push(t);
    }
    game.torches = keep;
    const n = popped - keep.length;
    if (n){ this.rebuild(); markSave(); }
    return n;
  },
  // feed the nearest 16 torches to the shader, with flicker
  updateUniforms(now){
    const u = game.terrainMat.uniforms;
    const near = [];
    for (let i = 0; i < game.torches.length; i++){
      const t = game.torches[i];
      const d = Math.hypot(t[0]-game.pos.x, t[1]-game.pos.y, t[2]-game.pos.z);
      if (d < 50) near.push([d, i, t]);
    }
    near.sort((a, b) => a[0] - b[0]);
    const n = Math.min(16, near.length);
    for (let i = 0; i < n; i++){
      const t = near[i][2];
      const flick = 9.5 + Math.sin(now * 0.011 + near[i][1] * 2.7) * 0.8;
      u.uTorch.value[i].set(t[0], t[1] + 0.45, t[2], flick);
    }
    u.uTorchN.value = n;
  },
};
// ---------- trees ----------
const treeSys = {
  group: null, visible: new Map(), lastCell: null,
  init(scene){ this.group = new THREE.Group(); scene.add(this.group); this.visible.clear(); this.lastCell = null; },
  mesh(t){
    const g = new THREE.Group();
    const trunkM = new THREE.MeshBasicMaterial({ color: 0x6b4a26 });
    const leafM = new THREE.MeshBasicMaterial({ color: 0x3e7d2e });
    const leafM2 = new THREE.MeshBasicMaterial({ color: 0x4e9639 });
    const trunk = new THREE.Mesh(new THREE.BoxGeometry(0.55, 2.6, 0.55), trunkM);
    trunk.position.y = 1.3;
    const c1 = new THREE.Mesh(new THREE.BoxGeometry(2.4, 1.3, 2.4), leafM);
    c1.position.y = 3.0;
    const c2 = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.0, 1.6), leafM2);
    c2.position.y = 4.0;
    g.add(trunk); g.add(c1); g.add(c2);
    g.scale.setScalar(t.s);
    g.position.set(t.x, t.y - 0.15, t.z);
    return g;
  },
  refresh(){
    if (!this.group) return;
    const cc = [Math.floor(game.pos.x / CORE.TREE_CELL), Math.floor(game.pos.z / CORE.TREE_CELL)];
    const key = cc[0] + ',' + cc[1];
    if (key === this.lastCell) return;
    this.lastCell = key;
    const R = Math.ceil(((game.opts.rd + 1) * CORE.CHUNK_M) / CORE.TREE_CELL) + 1;
    const want = new Set();
    for (let dz = -R; dz <= R; dz++) for (let dx = -R; dx <= R; dx++){
      const cx = cc[0] + dx, cz = cc[1] + dz;
      const k = cx + ',' + cz;
      if (game.removedTreeSet.has(k)) continue;
      const t = game.gen.treeAt(cx, cz);
      if (!t) continue;
      want.add(k);
      if (!this.visible.has(k)){
        const m = this.mesh(t);
        this.group.add(m);
        this.visible.set(k, { t, m });
      }
    }
    for (const [k, v] of this.visible){
      if (!want.has(k)){ this.group.remove(v.m); this.visible.delete(k); }
    }
  },
  fell(k, grant){
    const v = this.visible.get(k);
    if (!v) return;
    game.removedTreeSet.add(k);
    this.group.remove(v.m);
    this.visible.delete(k);
    const wood = Math.round(4 + 2 * v.t.s);
    if (grant){
      CORE.addMat(game.slots, CORE.MAT.WOOD, wood);
      toast('+' + wood + ' wood');
    }
    Particles.burst(v.t.x, v.t.y + 1.5, v.t.z, 1, [0x6b4a26, 0x3e7d2e], 30, 2.4);
    AudioSys.sfx('break', 0.8);
    refreshHotbar(); refreshToolHUD();
    markSave();
  },
  // ray vs trunk cylinders; returns visible-tree key
  onRay(maxDist){
    const dir = new THREE.Vector3();
    game.camera.getWorldDirection(dir);
    const o = game.camera.position;
    let best = null, bestT = maxDist;
    for (const [k, v] of this.visible){
      const t = v.t;
      const cy = t.y + 1.3 * t.s;
      const vx = t.x - o.x, vy = cy - o.y, vz = t.z - o.z;
      const tt = vx * dir.x + vy * dir.y + vz * dir.z;
      if (tt < 0 || tt > bestT) continue;
      const px = vx - dir.x * tt, py = vy - dir.y * tt, pz = vz - dir.z * tt;
      if (Math.abs(py) < 1.5 * t.s + 0.4 && Math.hypot(px, pz) < 0.45 * t.s + 0.25){
        best = k; bestT = tt;
      }
    }
    return best;
  },
  trunkNear(x, y, z){
    // trunk collision for the physics field
    let d = 1e9;
    for (const [, v] of this.visible){
      const t = v.t;
      const dh = Math.hypot(x - t.x, z - t.z);
      if (dh > 3) continue;
      const d2 = dh - 0.3 * t.s;
      const dy = Math.abs(y - (t.y + 1.3 * t.s)) - 1.3 * t.s;
      const pd = Math.hypot(Math.max(d2, 0), Math.max(dy, 0)) + Math.min(Math.max(d2, dy), 0);
      if (pd < d) d = pd;
    }
    return d;
  },
};

// ---------- doors & crafting tables ----------
const doorSys = {
  group: null,
  init(scene){ this.group = new THREE.Group(); scene.add(this.group); },
  rebuild(){
    if (!this.group) return;
    while (this.group.children.length) this.group.remove(this.group.children[0]);
    for (const d of game.doors){
      const g = new THREE.Group();
      const panel = new THREE.Mesh(new THREE.BoxGeometry(1.2, 2.2, 0.12), new THREE.MeshBasicMaterial({ color: 0x8a6237 }));
      panel.position.set(0.6, 1.1, 0);         // hinge at the group origin
      const handle = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, 0.2), new THREE.MeshBasicMaterial({ color: 0xd8c485 }));
      handle.position.set(1.02, 1.05, 0);
      g.add(panel); g.add(handle);
      g.position.set(d.x, d.y, d.z);
      g.rotation.y = d.yaw + (d.open ? Math.PI / 2 : 0);
      this.group.add(g);
    }
    rebuildSolidProps();
  },
  place(x, y, z){
    // hinge offset half a door to the side so the panel is centered on aim
    const yaw = Math.round(game.yaw / (Math.PI / 2)) * (Math.PI / 2);
    const hx = x - Math.cos(yaw) * 0.6, hz = z + Math.sin(yaw) * 0.6;
    game.doors.push({ x: hx, y, z: hz, yaw, open: false });
    this.rebuild(); markSave();
  },
  removeNear(x, y, z, r){
    const keep = [], n0 = game.doors.length;
    for (const d of game.doors){
      if (Math.hypot(d.x - x, d.y + 1.1 - y, d.z - z) > r) keep.push(d);
    }
    game.doors = keep;
    const n = n0 - keep.length;
    if (n){ this.rebuild(); markSave(); }
    return n;
  },
  onRay(maxDist){
    const dir = new THREE.Vector3();
    game.camera.getWorldDirection(dir);
    const o = game.camera.position;
    let best = null, bestT = maxDist;
    for (const d of game.doors){
      const cx = d.x + Math.cos(d.yaw + (d.open ? Math.PI/2 : 0)) * 0.6;
      const cz = d.z - Math.sin(d.yaw + (d.open ? Math.PI/2 : 0)) * 0.6;
      const vx = cx - o.x, vy = d.y + 1.1 - o.y, vz = cz - o.z;
      const t = vx * dir.x + vy * dir.y + vz * dir.z;
      if (t < 0 || t > bestT) continue;
      const px = vx - dir.x * t, py = vy - dir.y * t, pz = vz - dir.z * t;
      if (Math.abs(py) < 1.3 && Math.hypot(px, pz) < 0.8){ best = d; bestT = t; }
    }
    return best;
  },
};
const tableSys = {
  group: null,
  init(scene){ this.group = new THREE.Group(); scene.add(this.group); },
  rebuild(){

  removeNear(x, y, z, r){

    }

function nearTable(){
  for (const t of game.tables){
    if (Math.hypot(t[0] - game.pos.x, t[1] - game.pos.y, t[2] - game.pos.z) < 4) return true;
  }
  return false;
}
function rebuildSolidProps(){
  const props = [];
  for (const d of game.doors){
    if (d.open) continue;
    const yaw = d.yaw;
    props.push({ t: 'box', yaw,
      x: d.x + Math.cos(yaw) * 0.6, y: d.y + 1.1, z: d.z - Math.sin(yaw) * 0.6,
      hx: 0.6, hy: 1.1, hz: 0.09 });
  }
  for (const t of game.tables){
    props.push({ t: 'box', yaw: 0, x: t[0], y: t[1] + 0.45, z: t[2], hx: 0.55, hy: 0.46, hz: 0.55 });
  }
  game.solidProps = props;
}

function addStackItem(kind, n){
  for (const s of game.slots) if (s && s.kind === kind){ s.count += n; return true; }
  for (let i = 0; i < 40; i++) if (!game.slots[i]){ game.slots[i] = { kind, count: n }; return true; }
  return false;
}
function addTorchesToInv(n){ return addStackItem('torch', n); }
